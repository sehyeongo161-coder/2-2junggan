":["調胃承氣湯","茯苓四逆湯"],"original":"發汗後, 惡寒者, 虛故也, 不惡寒, 但熱者, 實也, 當和胃氣, 與調胃承氣湯. 發汗若下之, 病仍不解, 煩躁者, 茯苓四逆湯主之."},{"id":"sanghan-name-71","num":71,"parts":["太陽病, 發汗後, 大汗出, 胃中乾, 煩躁不得眠, 欲得飮水者, 少少與飮之, 令胃氣和則愈. 若脈浮, 小便不利, 微熱消渴者, ","主之."],"answers":["五苓散"],"original":"太陽病, 發汗後, 大汗出, 胃中乾, 煩躁不得眠, 欲得飮水者, 少少與飮之, 令胃氣和則愈. 若脈浮, 小便不利, 微熱消渴者, 五苓散主之."},{"id":"sanghan-name-72","num":72,"parts":["發汗已, 脈浮數, 煩渴者, ","主之."],"answers":["五苓散"],"original":"發汗已, 脈浮數, 煩渴者, 五苓散主之."},{"id":"sanghan-name-73","num":73,"parts":["傷寒汗出而渴者, ","主之, 不渴者, ","主之."],"answers":["五苓散","茯苓甘草湯"],"original":"傷寒汗出而渴者, 五苓散主之, 不渴者, 茯苓甘草湯主之."},{"id":"sanghan-name-74","num":74,"parts":["中風發熱, 六七日不解而煩, 有表裏證, 渴欲飮水, 水入則吐者, 名曰水逆, ","主之."],"answers":["五苓散"],"original":"中風發熱, 六七日不解而煩, 有表裏證, 渴欲飮水, 水入則吐者, 名曰水逆, 五苓散主之."},{"id":"sanghan-name-76","num":76,"parts":["發汗後, 水藥不得入口爲逆, 若更發汗, 必吐下不止. 發汗吐下後, 虛煩不得眠, 若劇者, 必反覆顚倒, 心中懊憹, ","主之. 若少氣者, ","主之. 若嘔者, ","主之."],"answers":["梔子豉湯","梔子甘草豉湯","梔子生薑豉湯"],"original":"發汗後, 水藥不得入口爲逆, 若更發汗, 必吐下不止. 發汗吐下後, 虛煩不得眠, 若劇者, 必反覆顚倒, 心中懊憹, 梔子豉湯主之. 若少氣者, 梔子甘草豉湯主之. 若嘔者, 梔子生薑豉湯主之."},{"id":"sanghan-name-77","num":77,"parts":["發汗, 若下之, 而煩熱胸中窒者, ","主之."],"answers":["梔子豉湯"],"original":"發汗, 若下之, 而煩熱胸中窒者, 梔子豉湯主之."},{"id":"sanghan-name-78","num":78,"parts":["傷寒五六日, 大下之後, 身熱不去, 心中結痛者, 未欲解也, ","主之."],"answers":["梔子豉湯"],"original":"傷寒五六日, 大下之後, 身熱不去, 心中結痛者, 未欲解也, 梔子豉湯主之."},{"id":"sanghan-name-79","num":79,"parts":["傷寒下後, 心煩腹滿, 臥起不安者, ","主之."],"answers":["梔子厚朴湯"],"original":"傷寒下後, 心煩腹滿, 臥起不安者, 梔子厚朴湯主之."},{"id":"sanghan-name-80","num":80,"parts":["傷寒, 醫以丸藥大下之, 身熱不去, 微煩者, ","主之."],"answers":["梔子乾薑湯"],"original":"傷寒, 醫以丸藥大下之, 身熱不去, 微煩者, 梔子乾薑湯主之."},{"id":"sanghan-name-81","num":81,"parts":["凡用",", 病人舊微溏者, 不可與服之."],"answers":["梔子湯"],"original":"凡用梔子湯, 病人舊微溏者, 不可與服之."},{"id":"sanghan-name-82","num":82,"parts":["太陽病發汗, 汗出不解, 其人仍發熱, 心下悸, 頭眩, 身瞤動, 振振欲擗地者, ","主之."],"answers":["眞武湯"],"original":"太陽病發汗, 汗出不解, 其人仍發熱, 心下悸, 頭眩, 身瞤動, 振振欲擗地者, 眞武湯主之."},{"id":"sanghan-name-88","num":88,"parts":["汗家重發汗, 必恍惚心亂, 小便已陰疼, 與","."],"answers":["禹餘糧丸"],  setTab($('tab-herbs-core'),key==='sanghan-herbs-core');setTab($('tab-herbs-reference'),key==='sanghan-herbs-reference');
 $('module').setAttribute('aria-labelledby',isBangjae?'tab-bangjae':key==='sanghan-names'?'tab-names':'tab-herbs');
 const config=CONFIG[key];$('available').hidden=false;$('pending').hidden=true;
 $('ref-missing').hidden=key!=='sanghan-herbs-reference';
 $('module-title').textContent=config.title;$('module-count').hidden=false;$('module-count').textContent=config.count;
 loadSession(key);render();saveSession(key);
 try{localStorage.setItem(VIEW_KEY,JSON.stringify({active,lastSanghan,lastHerbGroup}));}catch{storageOK=false;}showStorage();
 if(writeHash&&location.hash!=='#'+key){try{history.replaceState(null,'','#'+key);}catch{}}
}
function updateProgress(){const s=loadSession(active),n=CONFIG[active].data.length,q=question();const correct=s.mastered.length;$('bar').style.width=correct/n*100+'%';const p=$('bar').parentElement;p.setAttribute('aria-valuemax',String(n));p.setAttribute('aria-valuenow',String(correct));$('position').textContent=`${correct} / ${n} 완료${q&&s.wrong.includes(q.id)?' · 오답 복습':''}`;$('stats').textContent=`정답 ${correct} · 오답/정답 확인 ${s.attempts}회 · 남은 문제 ${n-correct}`;}
function render(){
 const c=CONFIG[active],s=loadSession(active),q=question();$('quiz').hidden=!q;$('finish').hidden=!!q;$('shuffle').disabled=!q;
 if(!q){$('finish-summary').textContent=`${s.mastered.length} / ${c.data.length} 완료 · 오답/정답 확인 ${s.attempts}회`;renderRules();return;}
 $('question-title').replaceChildren();$('passage').replaceChildren();$('answers').replaceChildren();$('feedback').replaceChildren();$('feedback').hidden=!s.done;$('question-meta').hidden=true;
 const isNames=c.kind==='names';$('passage').hidden=!isNames;
 if(isNames){
 $('question-title').textContent=q.num+'조';
 q.parts.forEach((part,i)=>{$('passage').append(document.createTextNode(part));if(i<q.answers.length){const count=Array.from(q.answers[i]).length;const b=el('button',{className:'blank',type:'button'});b.append(el('sup',{className:'blank-number'},String(i+1)),el('span',{className:'blank-slots'},Array(count).fill('_').join(' ')));b.setAttribute('aria-label',`${i+1}번 빈칸, ${count}글자. 답 입력란으로 이동`);b.onclick=()=>{const field=$('answer-'+i);if(!field.disabled)field.focus();};$('passage').append(b);}});
 q.answers.forEach((a,i)=>{const row=el('div',{className:'answer-row'}),label=el('label',{htmlFor:'answer-'+i},'빈칸 '+(i+1)),input=el('input',{id:'answer-'+i,type:'text',value:s.drafts[i]||'',placeholder:'처방명 입력',autocomplete:'off',spellcheck:false,disabled:s.done});input.setAttribute('aria-describedby','input-help');input.oninput=()=>{s.drafts[i]=input.value;saveSession();};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();if(i<q.answers.length-1)$('answer-'+(i+1)).focus();else check(false);}});row.append(label,input);$('answers').append(row);});
 $('input-help').textContent='한글 또는 한자로 입력해 주세요. 모든 빈칸을 맞히면 조문 1개가 완료됩니다.';
 }else{
 $('question-title').append(document.createTextNode(active.startsWith('sanghan-herbs-')?q.name:q.source==='첨부 자료'?q.name:q.source==='동원'?`동원 ${q.name}`:`《${q.source}》 ${q.name}`),el('span',{className:'hanja'},q.hanja));
 if(active.startsWith('sanghan-herbs-')){$('question-meta').textContent=`${q.clauses==='비교'||q.clauses==='비교표'||q.clauses==='비교 언급'?'강의 비교·참고':q.clauses} · ${q.exception?'표준 원방 구성 보충':`강의 ${q.lecture}`}`;$('question-meta').hidden=false;}
 $('position').textContent='';const input=el('textarea',{id:'answer-0',value:s.drafts[0]||'',placeholder:'약재 사이를 쉼표 또는 공백으로 구분해 주세요.',spellcheck:false,autocomplete:'off',disabled:s.done});input.setAttribute('aria-label','구성 약재 입력');input.oninput=()=>{s.drafts[0]=input.value;saveSession();};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();check(false);}});$('answers').append(input);$('input-help').textContent='약재 순서는 상관없습니다. 용량·포제 제외, 자료에 있는 생강·대조는 포함합니다.';
 }
 $('check').disabled=s.done;$('show').disabled=s.done;$('next').hidden=!s.done;$('next').textContent=s.mastered.length===c.data.length?'결과 보기 →':'다음 문제 →';updateProgress();if(!isNames&&!active.startsWith('sanghan-herbs-'))$('position').textContent+=' · '+q.num+'번';if(s.done)renderFeedback();renderRules();
}
function renderRules(){
 const box=$('rule-text');box.replaceChildren();
 const text=CONFIG[active].kind==='names'?[
 '첨부한 「본과 2-2 상한론 중간고사 처방명 빈칸.pdf」와 정답본을 대조했습니다. 빈칸이 있는 45개 조문(총 58칸)만 출제합니다. 빈칸 없는 15개 조문은 출제하지 않습니다.',
 '조문과 빈칸 위치는 첨부 자료 기준입니다. 시호(柴胡)·시호탕(柴胡湯)·소시호탕(小柴胡湯), 치자탕(梔子湯)·치자시탕(梔子豉湯)은 원문대로 구분합니다. 약칭은 인정하지 않습니다. 공백은 무시하며 한글 또는 원문 한자를 인정합니다.',
 '한 조문의 모든 빈칸을 맞혀야 완료됩니다. 틀리거나 정답을 확인한 조문은 미출제 조문 뒤에서 다시 나옵니다. 셔플은 완료한 조문을 유지하며, 채점한 현재 조문은 다음으로 넘어갈 때까지 고정합니다.'
 ]:active==='bangjae-herbs'?[
 '「실습시험처방 Clean 2 (1).pdf」 26–60번을 바탕으로 만든 기존 방제학 퀴즈 데이터를 그대로 사용합니다. 35개 처방, 출전 구분을 포함해 40문항입니다. 31·43·52·53번은 출전별로 별도 출제합니다.',
 '용량과 포제는 묻지 않습니다. 자료에 있는 생강·대조 등은 답에 포함합니다. 같은 약재를 여러 번 입력해도 한 번으로 처리합니다.',
 '인정하는 동의어: 소엽=자소엽, 소자=자소자, 나복자=내복자, 축사=사인=축사인, 남성=천남성, 인진=인진호, 연자=연자육, 귤피=진피, 감초=자감초. 백복령·적복령·복령, 백작약·적작약·작약, 계지·육계·계피는 구분합니다. 한글로 입력해 주세요.',
 '틀리거나 정답을 확인한 문제는 미출제 문제 뒤에서 다시 나옵니다. 진행 숫자는 맞힌 문제 수입니다.'
 ]:[
 '첨부하신 「상한론 처방구성.pdf」의 PART 1(핵심 24처방)·PART 2(비교·참고 13처방) 분류를 그대로 따릅니다. 두 그룹의 퀴즈와 진행 상태는 독립적입니다.',
 '구성 약재가 확인되는 처방만 출제합니다. 비교·참고 13처방 중 강의자료에 구성이 명시되지 않은 6처방은 퀴즈에서 제외하고 목록에 표시합니다.',
 '계지탕·마황탕 2개는 앞서 요청하신 대로 표준 원방 구성을 보충했고, 그 밖의 처방은 제공된 암기표에 적힌 강의자료 기준의 약재만 사용합니다.',
 '가감방은 기본방 약재까지 펼쳐 적습니다(예: 계지가후박행자탕 7미, 시호가망초탕 8미). 용량·포제·약재 순서는 채점하지 않으며 생강·대조는 구성에 있을 때 포함합니다. 교이=이당, 부자=포부자=생부자를 인정합니다.',
 '틀리거나 정답을 확인한 처방은 아직 출제되지 않은 처방 뒤에서 재출제합니다. 셔플은 완료 기록을 유지합니다.'
 ];
 text.push('과목·학습 유형별 진행 상태는 이 브라우저에 따로 저장됩니다. 새로고침·탭 전환 시 유지됩니다. 다른 기기·브라우저에는 동기화되지 않으며, 브라우저 데이터 삭제 시 사라집니다. HTML 파일은 인터넷 연결 없이도 사용할 수 있습니다.');
 text.forEach(t=>box.append(el('p',{},t)));
}
function check(reveal){
 if(!CONFIG[active])return;const s=loadSession(active),q=question();if(!q||s.done)return;const c=CONFIG[active],n=c.kind==='names'?q.answers.length:1;s.drafts=Array.from({length:n},(_,i)=>$('answer-'+i).value);
 if(!reveal){const missing=s.drafts.findIndex(v=>!v.trim());if(missing!==-1){$('answer-'+missing).focus();toast('빈칸에 답을 입력해 주세요.');return;}}
 const result=evaluate(s.drafts,q,c.kind);s.done=true;s.reveal=!!reveal;s.lastOK=!reveal&&result.ok;
 if(s.lastOK){s.mastered.push(q.id);s.wrong=s.wrong.filter(id=>id!==q.id);}else{s.attempts++;if(!s.wrong.includes(q.id))s.wrong.push(q.id);}
 saveSession();render();$('next').focus();
}
function chips(title,items,cls){const f=$('feedback');f.append(el('div',{className:'chip-title'},title));const box=el('div',{className:'chips'});items.forEach(t=>box.append(el('span',{className:'chip '+(cls||'')},t)));f.append(box);}
function renderFeedback(){
 const s=loadSession(active),q=question(),c=CONFIG[active],r=evaluate(s.drafts,q,c.kind),f=$('feedback');f.replaceChildren();f.hidden=false;f.append(el('h4',{className:s.lastOK?'correct':'wrong'},s.lastOK?'정답입니다.':s.reveal?'정답을 확인했습니다.':'다시 기억해 보세요.'));
 if(c.kind==='names'){
 const blanks=$('passage').querySelectorAll('.blank');
 q.answers.forEach((a,i)=>{const hit=!s.reveal&&r.marks[i],row=el('div',{className:'answer-result'});row.append(el('small',{},`빈칸 ${i+1} · ${s.reveal?'정답':hit?'정답':'오답'}`),el('p',{className:hit?'correct':'wrong'},`${NAME_KO[a]} · ${a}`));if(!hit&&s.drafts[i])row.append(el('small',{},'입력: '+s.drafts[i]));f.append(row);blanks[i].textContent=a;blanks[i].classList.add(hit?'correct':'wrong');blanks[i].disabled=true;$('answer-'+i).setAttribute('aria-invalid',String(!s.reveal&&!hit));});
 }else{if(!s.reveal&&!s.lastOK){if(r.missing.length)chips('빠뜨린 약재',r.missing,'miss');if(r.extra.length)chips('추가로 쓴 약재',r.extra,'extra');if(r.matched.length)chips('맞게 쓴 약재',r.matched);}chips('전체 구성',q.herbs);}
}
function nextQuestion(){const s=loadSession(active);if(!s.done)return;const id=s.queue.shift();if(!s.lastOK)s.queue.push(id);s.done=false;s.reveal=false;s.lastOK=false;s.drafts=[];saveSession();render();if(question())$('answer-0').focus();else $('again').focus();}
function shuffleRemaining(){const s=loadSession(active);if(!s.queue.length)return;const old=s.queue[0],pinned=s.done?[old]:[],pending=s.done?s.queue.slice(1):s.queue;const fresh=shuffle(pending.filter(id=>!s.wrong.includes(id))),retry=shuffle(pending.filter(id=>s.wrong.includes(id)));let rest=[...fresh,...retry];if(!s.done&&rest[0]===old){const group=fresh.length?fresh:retry;if(group.length>1)group.push(group.shift());rest=[...fresh,...retry];}s.queue=[...pinned,...rest];if(!s.done&&s.queue[0]!==old)s.drafts=[];saveSession();render();toast('남은 문제를 섞었습니다.');}
function resetSession(){if(!CONFIG[active])return;if(!confirm(CONFIG[active].title+'의 진행 상태를 초기화할까요? 다른 퀴즈의 기록은 유지됩니다.'))return;sessions[active]=newSession(active);saveSession();render();$('answer-0').focus();}
function init(){
 $('tab-sanghan').onclick=()=>selectMode(lastSanghan);
 $('tab-bangjae').onclick=()=>selectMode('bangjae-herbs');
 $('tab-names').onclick=()=>selectMode('sanghan-names');
 $('tab-herbs').onclick=()=>selectMode(lastHerbGroup);
 $('tab-herbs-core').onclick=()=>selectMode('sanghan-herbs-core');
 $('tab-herbs-reference').onclick=()=>selectMode('sanghan-herbs-reference');
 document.querySelectorAll('[role="tablist"]').forEach(list=>{list.addEventListener('keydown',e=>{const tabs=Array.from(list.querySelectorAll('[role="tab"]'));let i=tabs.indexOf(document.activeElement);if(i===-1)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft')i=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();tabs[i].click();tabs[i].focus();});});
 $('check').onclick=()=>check(false);$('show').onclick=()=>check(true);$('next').onclick=nextQuestion;$('shuffle').onclick=shuffleRemaining;$('reset').onclick=resetSession;$('again').onclick=resetSession;
 $('ref-missing-list').replaceChildren(...SOURCE.sanghanReferenceNoComposition.map(q=>el('li',{},q.name+' · '+q.hanja)));
 let saved;try{saved=JSON.parse(localStorage.getItem(VIEW_KEY)||'null');}catch{storageOK=false;}
 if(saved){
  if(saved.lastHerbGroup&&CONFIG[saved.lastHerbGroup]&&saved.lastHerbGroup.startsWith('sanghan-herbs-'))lastHerbGroup=saved.lastHerbGroup;
  if(saved.lastSanghan==='sanghan-herbs')lastSanghan='sanghan-herbs-core';
  else if(['sanghan-names','sanghan-herbs-core','sanghan-herbs-reference'].includes(saved.lastSanghan))lastSanghan=saved.lastSanghan;
 }
 const fromHash=location.hash.slice(1),route=fromHash==='sanghan'?'sanghan-names':fromHash==='bangjae'?'bangjae-herbs':fromHash;
 selectMode(route||(saved&&saved.active)||'sanghan-names');
 window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);selectMode(h==='sanghan'?'sanghan-names':h==='bangjae'?'bangjae-herbs':h,false);});
}
init();
