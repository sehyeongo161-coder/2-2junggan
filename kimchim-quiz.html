const GROUPS=[{"id":"needles","title":"구침(九鍼) — 침의 종류","page":"12–13","items":[["鑱鍼(참침)","피부를 淺刺하여 瀉血해서 熱을 치료하며 陽分의 邪氣를 瀉한다.","화살촉 모양의 후세 전두침과 연결됩니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["圓鍼(원침)","圓頭鍼으로 체표를 문질러 分肉間의 氣滯를 치료하고 肌肉을 손상시키지 않는다. 침끝은 난원형이다.","찌르는 침이 아니라 분육을 문지르는 침입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["鍉鍼(시침)","주로 經脈을 누르는 용도로 사용하고, 피부에 함입하지 않는 방식으로 邪氣를 이끌어낸다.","경맥을 안압하는 데 사용하는 침입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["鋒鍼(봉침)","사혈을 통해 癰腫熱病과 痼疾을 치료한다. 침첨에 세 개의 칼날이 있다.","후세 삼릉침의 전신에 해당합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["鈹鍼(피침)","大膿을 뽑아내고 외과병증을 치료한다. 끝이 칼날(검봉) 모양이다.","외과적 메스와 비슷한 역할입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["圓利鍼(원리침)","深刺하여 癰腫痺症을 치료하며 痺氣가 갑자기 나타나는 暴氣를 다스린다.","급성으로 나타나는 비증과 관련됩니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["毫鍼(호침)","서서히 자침하고 오래 유침하여 寒熱痛痺가 경락에 있는 병증을 치료한다.","오늘날 일반적인 자침의 대표 도구입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["長鍼(장침)","深刺하여 병사가 깊이 있는 것을 치료하며 遠痺를 치료한다.","후세의 환도침과 연결됩니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"],["大鍼(대침)","관절에 찬 물을 빼낼 때 사용(瀉水)하며 관절질병을 치료한다.","길이보다 굵기·사수 용도를 구분하세요.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 12–13쪽 (구별 포인트)"]]},{"id":"five","title":"오자(五刺)","page":"17–19","items":[["半刺(반자)","피부에 淺刺하고 빠르게 出鍼하여 근육층에 닿지 않도록 한다. 表邪를 치료하며 肺와 상응한다.","폐주피모·피부 천자가 핵심입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 17–19쪽 (구별 포인트)"],["豹文刺(표문자)","혈위의 전후좌우를 散刺하여 細小血脈을 자침하고 경락의 鬱血을 방출한다. 心과 상응한다.","심주혈맥, 사혈, 여러 곳의 출혈점으로 구별합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 17–19쪽 (구별 포인트)"],["關刺(관자)","사지 관절 부근의 盡筋(건이 뼈에 부착하는 부위)에 刺하여 筋痺症을 치료하며 肝과 상응한다.","간주근, 건 부착부 및 관절 부근이 핵심입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 17–19쪽 (구별 포인트)"],["合谷刺(합곡자)","肌肉 중에 斜刺하여 鷄爪 형태와 같이 몇 개 방향에서 透刺한다. 筋痺를 치료하며 脾와 상응한다.","비주기육·계조(鷄爪) 모양의 다방향 자침입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 17–19쪽 (구별 포인트)"],["輸刺(수자)","수직으로 자침 및 발침하여 골격까지 深刺한다. 骨痺를 치료하며 腎과 상응한다.","신주골. 십이자의 동명 수자와 발침 방식·대상을 구별하세요.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 17–19쪽 (구별 포인트)"]]},{"id":"nine","title":"구자(九刺)","page":"20–21","items":[["兪刺(수자)","오장에 병이 있으면 해당 경락의 肘膝關節 이하 滎穴·兪穴과 背部의 해당 五臟兪(背兪穴)를 취한다.","오장 질환에서 배수혈과 형·수혈을 배합하는 배혈원칙입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["遠道刺(원도자)","병이 顔面이나 軀幹의 上部에 있으면 下肢 穴位를 취하며 六腑病에는 下合穴을 활용한다.","상병하취·육부하합혈을 기억하세요.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["經刺(경자)","經脈이 소통하는 부위 중 氣血이 응체된 부위에 자침한다.","순경취혈과 경맥 기혈의 울체가 핵심입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["絡刺(낙자)","체표의 鬱血된 細小絡脈을 자침하여 血絡을 瀉한다.","표문자·찬자와 유사하지만 구자의 자락맥 사혈입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["分刺(분자)","침이 심층근육까지 다다르게 하며 分肉之間에 자침한다.","구자의 분자(分刺): 깊은 근육층 자침입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["大瀉刺(대사자)","鈹鍼으로 화농된 癰疽를 절개하여 排膿한다.","절개·배농과 鈹鍼(피침)을 연결하세요.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["毛刺(모자)","병소의 피부표면(皮毛)에 淺刺하여 浮痺를 치료한다.","오자의 반자와 비슷한 피부층 자침입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["巨刺(거자)","左病에 右側, 右病에 左側을 취하는 좌우 교차 配穴이다.","좌병우치·우병좌치. 무자와의 세부 차이는 별도로 학습합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"],["焠刺(췌자)","침을 붉게 달구어 체표에 刺入하여 痺症을 치료한다.","화침. 침을 넣은 뒤 달구는 온침과 다릅니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 20–21쪽 (구별 포인트)"]]},{"id":"twelve","title":"십이자(十二刺)","page":"21–23","items":[["偶刺(우자)","전흉부를 압박하여 압통 부위를 찾아 前(胸腹)에 一刺, 後(背)에 一刺하며 병소에 대칭으로 자침한다.","전후배혈·음양자. 수모배혈의 선행 형태입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["報刺(보자)","통증 부위가 일정하지 않고 상하로 유주할 때 자침 후 곧 발침하지 않고 병통부를 안마한 뒤 다시 자침한다.","자침 → 발침 → 다시 자침하는 반복입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["恢刺(회자)","筋腱의 측방에서 자입하고 전후 다방향으로 橫鍼透刺하여 연축을 완화한다.","힘줄·근건의 연축에 대한 다방향 횡투자입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["齊刺(제자)","正中에 1鍼, 그 양측에 각각 자입하여 세 침을 나란하게 배열한다.","세 개의 침을 함께 쓰므로 삼자라고도 합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["揚刺(양자)","正中에 1鍼을 直刺하고 주변에서 중심을 향해 4개의 침을 橫鍼透刺한다.","총 다섯 침. 비교적 얕고 범위가 넓은 비증에 사용합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["直鍼刺(직침자)","혈위의 피부를 손끝으로 집고 피부 밑을 따라 자입한다.","이름과 달리 일반적인 수직 직자가 아니라 피하를 따르는 횡자입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["輸刺(수자)","수직으로 深刺하고 완만하게 발침하여 氣盛有熱한 熱性病을 치료한다.","오자의 수자와 동명이지만 열성병·완만한 발침이 특징입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["短刺(단자)","약간 요동시키면서 골격에 닿도록 深刺한 후 골격 부근에서 침을 상하로 進退시킨다.","단(短)은 짧게 놓는다는 뜻이 아니라 뼈에 접근한다는 뜻입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["浮刺(부자)","斜刺하여 근육층을 향해 횡으로 透刺하며 측방으로 淺刺한다.","근육층을 겨냥하는 사자·횡투자입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["陰刺(음자)","좌우 양측의 상대되는 혈위(주로 陰經 혈위)를 동시에 취혈한다.","좌우배혈. 우자의 전후배혈과 대비하세요.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["傍鍼刺(방침자)","直刺한 1鍼 옆에 다른 1鍼을 斜刺한다.","직자 한 침 + 옆에서 사자 한 침, 총 두 개입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"],["贊刺(찬자)","수직으로 자침 및 발침을 여러 차례 반복해 淺刺·出血시켜 癰腫을 치료한다.","얕은 직자·다회 사혈이 핵심입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 21–23쪽 (구별 포인트)"]]},{"id":"fourteen","title":"자침십사법(刺鍼十四法)","page":"27–29","items":[["動法(동법)","鍼을 刺入한 후 氣가 不行하면 鍼을 搖動시켜 氣를 움직이게 한다.","행기 목적, 후대 청룡파미법으로 발전합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["退法(퇴법)","拔鍼할 때 먼저 약간 退鍼하여 皮下에 잠시 留鍼한 후 補瀉法의 조작원칙에 따라 발침한다.","점진적인 발침으로 출혈을 줄이는 방식입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["搓法(차법)","자침 후 새끼를 꼬듯 침을 외측 혹은 내측으로 회전한다. 左轉揷鍼은 熱, 右轉退鍼은 寒이라고 설명한다.","강한 염전 자극은 활용되나 좌우의 한열 배당은 임상가치가 없다고 강의합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["進法(진법)","자침해도 氣가 不至하면 男은 外(左), 女는 內(右)로 염전하면서 進鍼한다.","남녀 좌우 구분은 실용성이 없고 염전 진침의 최기작용을 설명합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["盤法(반법)","腹部의 肉軟部位에 자침하여 循環狀으로 5회씩 회전한다. 좌회전 揷鍼은 補, 우회전 退鍼은 瀉라고 설명한다.","복부·큰 원형 회전. 좌삽우퇴 보사설은 강의에서 실용성이 낮다고 평가합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["搖法(요법)","瀉法인 경우 拔鍼할 때 搖動시키면서 退鍼한다.","요동 발침, 강자극과 연관됩니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["彈法(탄법)","補法인 경우 拇指의 爪甲으로 鍼尾를 가볍게 튕겨 氣를 빠르게 운행시킨다.","침꼬리를 톡톡 튕기는 동작입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["捻法(염법)","左轉은 補, 右轉은 瀉라고 한다. 上을 치료할 때 左轉, 下를 치료할 때 右轉한다.","좌전보·우전사설은 강의에서 실제 가치는 없다고 평가합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["循法(순법)","자극한 穴位의 經絡 분포경로를 손가락으로 上下로 문지른다.","득기 불충분 시 보조적으로 활용합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["捫法(문법)","補法인 경우 손가락으로 穴位를 눌러 막는다.","발침 후 지혈과 개합보사에 관련됩니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["攝法(섭법)","刺鍼後 氣가 澀滯하면 엄지·검지·중지 爪甲으로 經絡穴位를 왕복하며 누른다.","지체된 경기를 소통시키는 손톱 왕복 압박입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["按法(안법)","刺鍼하여 緊張시켜 不進不退인 상태에서 손가락으로 鍼體를 굽혀 弓狀을 만든다.","자침십사법의 안(按/弩): 침체를 휘는 조작입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["爪法(조법)","刺鍼할 때 손가락으로 穴位를 겨냥하여 爪甲으로 표시한다.","취혈 표시·정확한 혈위 선택이 목적입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"],["切法(절법)","자침 전 엄지손톱으로 穴位 좌우를 눌렀다가 자침한다.","진침 전 손톱 압박 동작입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 27–29쪽 (구별 포인트)"]]},{"id":"parts","title":"호침의 구조","page":"33","items":[["鍼尖(침첨·침망)","鍼 선단의 뾰족한 부분이다.","이상적인 침첨은 너무 지나치게 날카롭지 않고 솔잎 끝과 비슷합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 33쪽 (구별 포인트)"],["鍼體(침체·침신)","鍼尖과 鍼柄 사이 부분이다. 毫鍼의 길이·굵기는 주로 이 부분을 말한다.","침체는 손으로 잡는 침병과 다릅니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 33쪽 (구별 포인트)"],["鍼根(침근)","鍼體와 鍼柄이 만나는 부위이다.","이음부가 부식·파손되면 절침의 위험이 있습니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 33쪽 (구별 포인트)"],["鍼柄(침병)","鍼體 뒤에서 금속선을 나선모양으로 감아 손가락으로 잡는 부분이다.","염전·제삽 시 파지하는 곳입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 33쪽 (구별 포인트)"],["鍼尾(침미)","鍼柄의 말단에 금속선을 원형으로 꼬아 만들며 침첨의 반대쪽 끝이다.","가장 뒤쪽에 해당합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 33쪽 (구별 포인트)"]]},{"id":"insert","title":"호침 진침법","page":"37","items":[["指切進鍼法(지절진침법)","손가락의 손톱으로 혈위를 눌러 침을 손톱 옆에 붙여 자입한다.","손톱으로 눌러 지지하며 진침합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 37쪽 (구별 포인트)"],["挾持進鍼法(협지진침법)","엄지·검지로 침체를 잡아 지지하면서 긴 침을 밀어 넣는다.","장침 사용·침체를 양손으로 받치는 것이 핵심입니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 37쪽 (구별 포인트)"],["舒張進鍼法(서장진침법)","엄지와 검지로 자침할 피부를 팽팽하게 펴고 진침한다.","느슨하고 주름진 피부의 자침에 사용합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 37쪽 (구별 포인트)"],["摘取進鍼法(적취진침법)","엄지와 검지로 피부를 집어 올린 다음 진침한다. 특히 얼굴 등 피육이 얇은 부위에 사용한다.","피부를 집어 올리는 것과 피부를 펴는 것을 구별합니다.","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽 (문제 설명) / 김침 중간 써머리.pdf PDF 37쪽 (구별 포인트)"],["單手進鍼法(단수진침법)","한 손의 엄지와 검지로 침병을 잡고 중지 끝으로 침체 하단을 받친 후 자입한다.","손 한쪽만 사용하는 진침입니다."],["管鍼進鍼法(관침진침법)","침관을 사용하여 진침한다.","침관을 이용해 통증을 const OPTIONAL=new Set(["assist","handle"]);
let selectedCategory="all", includeExtra=false, mode="quiz", shuffle=true, queue=[],cursor=0,failed=[],phase=1,choice=null,completed=0,correct=0;
const $=id=>document.getElementById(id);
const allEntries=()=>GROUPS.filter(g=>includeExtra||!OPTIONAL.has(g.id)).flatMap(g=>g.items.map((a,i)=>({id:g.id+'-'+i,group:g,term:a[0],definition:a[1],tip:a[2],source:a[3]})));
const entries=()=>allEntries().filter(q=>selectedCategory==="all"||q.group.id===selectedCategory);
function shuffled(items){const a=items.slice();if(shuffle)for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function reset(){queue=shuffled(entries());cursor=0;failed=[];phase=1;choice=null;completed=0;correct=0;render();}
function notifySize(){requestAnimationFrame(()=>{const h=Math.ceil(document.documentElement.scrollHeight);parent!==window&&parent.postMessage({type:'kimchim-size',height:h},location.origin)})}
function setCategory(id){selectedCategory=id;reset();}
function renderNav(){const nav=$("groupNav");nav.replaceChildren();
 const add=(name,id,count)=>{const b=document.createElement("button");b.textContent=name+" · "+count;b.className=id===selectedCategory?"active":"";b.onclick=()=>setCategory(id);nav.appendChild(b)};
 const groups=GROUPS.filter(x=>includeExtra||!OPTIONAL.has(x.id));add("전체", "all",groups.reduce((a,b)=>a+b.items.length,0));for(const g of groups)add(g.title,g.id,g.items.length);
 const b=document.createElement("button");b.textContent=includeExtra?"추가 범주 숨기기":"추가 범주 보기";b.setAttribute("aria-pressed",String(includeExtra));b.onclick=()=>{includeExtra=!includeExtra;selectedCategory="all";reset()};nav.appendChild(b);
}
function getOptions(q){const pool=q.group.items.map(e=>e[0]).filter(x=>x!==q.term);return shuffled([q.term,...shuffled(pool).slice(0,Math.min(3,pool.length))]);}
const optionMemo=new Map();
function optionsFor(q){if(!optionMemo.has(q.id))optionMemo.set(q.id,getOptions(q));return optionMemo.get(q.id)}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function saveResult(q,ok){try{const k='kimchim-quiz-history-v1';const a=JSON.parse(localStorage.getItem(k)||'{}');const m=a[q.id]||{right:0,wrong:0};m[ok?'right':'wrong']++;a[q.id]=m;localStorage.setItem(k,JSON.stringify(a))}catch{}}
function answer(ix){if(choice!==null||cursor>=queue.length)return;const q=queue[cursor],opts=optionsFor(q);choice=ix;const ok=opts[ix]===q.term;completed++;if(ok)correct++;else if(!failed.find(x=>x.id===q.id))failed.push(q);saveResult(q,ok);renderQuestion();parent!==window&&parent.postMessage({type:'kimchim-focus-grade',top:0,explanationTop:450},location.origin)}
function advance(){if(choice===null){return;}cursor++;choice=null;if(cursor>=queue.length){if(phase===1&&failed.length){queue=shuffled(failed);failed=[];phase=2;cursor=0;optionMemo.clear();}}render();}
function renderQuestion(){const host=$('quiz');host.replaceChildren();
 if(cursor>=queue.length){const box=make('div','card summary');box.appendChild(make('h2','',phase===2?'오답 재학습 완료':'첫 회차 완료'));box.appendChild(make('p','',phase===1?'이번 회차의 문항을 모두 풀었습니다.':'틀렸던 문항을 한 번 더 복습했습니다.'));const b=make('button','primary','다시 시작');b.onclick=reset;box.appendChild(b);host.appendChild(box);return}
 const q=queue[cursor],opts=optionsFor(q),done=choice!==null,yes=done&&opts[choice]===q.term;
 const box=make('div','card');box.appendChild(make('div','crumb',q.group.title));const line=make('div','progressline');const inner=make('span');inner.style.width=(queue.length?cursor/queue.length*100:0)+'%';line.appendChild(inner);box.appendChild(line);
 box.appendChild(make('div','meta',(phase===1?'1회차':'오답 복습')+' · '+(cursor+1)+' / '+queue.length+' · 설명에 해당하는 명칭을 고르세요.'));
 box.appendChild(make('div','question',q.definition));
 const optsHost=make('div','options');opts.forEach((name,i)=>{const b=make('button','option');b.type='button';b.disabled=done;b.appendChild(make('b','',String(i+1).padStart(2,'0')));b.appendChild(make('span','',name));if(done&&name===q.term)b.classList.add('correct');if(done&&i===choice&&!yes)b.classList.add('incorrect');b.onclick=()=>answer(i);optsHost.appendChild(b)});box.appendChild(optsHost);
 if(done){const fb=make('div','feedback');fb.appendChild(make('h3',yes?'O · 정답입니다':'X · 오답입니다'));fb.appendChild(make('p','', '정답: '+q.term));fb.appendChild(make('p','why','구별 포인트: '+q.tip));fb.appendChild(make('p','source','근거: '+(q.source||'김침 중간 써머리.pdf PDF '+q.group.page+'쪽')));box.appendChild(fb)}
 const foot=make('div','foot');foot.appendChild(make('span','meta','숫자키 1–4 선택 · Enter 다음'));const next=make('button','primary',done?'다음 문제 (Enter)':'선지를 선택하세요');next.disabled=!done;next.onclick=advance;foot.appendChild(next);box.appendChild(foot);host.appendChild(box);
}
function renderList(){const host=$('list');host.replaceChildren();for(const q of entries()){const box=make('article','listitem');box.appendChild(make('span','tag',q.group.title));box.appendChild(make('h3','',q.term));box.appendChild(make('p','',q.definition));box.appendChild(make('p','desc',q.tip));box.appendChild(make('p','source',(q.source||'김침 중간 써머리.pdf PDF '+q.group.page+'쪽')));host.appendChild(box)}}
function render(){renderNav();$('quiz').hidden=mode!=='quiz';$('list').hidden=mode!=='list';$('quizBtn').setAttribute('aria-pressed',String(mode==='quiz'));$('listBtn').setAttribute('aria-pressed',String(mode==='list'));$('statCount').innerHTML='현재 문항 <strong>'+entries().length+'</strong>개';$('statPhase').textContent=phase===1?'첫 회차':'오답 복습';$('statCorrect').textContent='맞힌 횟수 '+correct+' / '+completed;
 if(mode==='quiz')renderQuestion();else renderList();notifySize()}
$('quizBtn').onclick=()=>{mode='quiz';render()};$('listBtn').onclick=()=>{mode='list';render()};
$('resetBtn').onclick=()=>{optionMemo.clear();reset()};
$('shuffleBtn').onclick=()=>{shuffle=!shuffle;optionMemo.clear();$('shuffleBtn').textContent=shuffle?'순서 섞기 ✓':'순서대로';reset()};
window.addEventListener('keydown',e=>{if(mode!=='quiz'||e.isComposing||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 if(/^[1-4]$/.test(e.key)&&choice===null){const q=queue[cursor];if(!q)return;const i=Number(e.key)-1;if(i<optionsFor(q).length){e.preventDefault();answer(i)}}else if(e.key==='Enter'&&choice!==null){e.preventDefault();advance();}});
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;const d=e.data;if(d.type==='kimchim-key'){const ke=new KeyboardEvent('keydown',{key:d.key,bubbles:true});window.dispatchEvent(ke)}});
if('ResizeObserver' in window)new ResizeObserver(notifySize).observe(document.body);
reset();
</script></body></html>
