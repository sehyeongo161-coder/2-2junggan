const GROUPS=[{"id":"needles-form","title":"구침(九鍼) · 형상","page":"8–10","items":[["鑱鍼(참침)","길이 1寸 6分. 말단의 1分이 尖銳하며, 鍼頭가 크고 鍼尖이 예리한 형상이다.","큰 鍼頭 · 예리한 鍼尖 · 끝 1分이 뾰족함.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 4쪽 / 김침 중간 수업자료.pdf PDF 8쪽"],["圓鍼(원침)","길이 1寸 6分. 鍼體는 원주형이고, 鍼尖은 계란처럼 둥근 난원형이다.","원주형 몸통 · 달걀 모양 침첨.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 3쪽 / 김침 중간 수업자료.pdf PDF 8쪽"],["鍉鍼(시침)","길이 3寸半. 鋒(鍼尖)이 기장(黍)이나 조(粟)처럼 둥글면서 뾰족한 형상이다.","길이 3寸半 · 곡식 낟알처럼 둥글고 뾰족한 침첨.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 3쪽 / 김침 중간 수업자료.pdf PDF 9쪽"],["鋒鍼(봉침)","길이 1寸 6分. 鍼體는 원통형이며 鋒(鍼尖)에 세 개의 칼날(刃)이 있는 형상이다.","원통형 침체 · 세 개의 칼날로 된 침첨.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 3~4쪽 / 김침 중간 수업자료.pdf PDF 9쪽"],["鈹鍼(피침)","길이 4寸, 너비 2分半. 끝이 칼날(劍鋒)과 같은 형상이다.","넓은 검봉(劍鋒) 모양 침끝 · 길이 4寸.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 4쪽 / 김침 중간 수업자료.pdf PDF 9쪽"],["圓利鍼(원리침)","길이 1寸 6分. 鍼尖은 꼬리와 같으면서 둥글고 예리하며, 鍼體 중간은 약간 굵은 형상이다.","둥글면서 예리한 침첨 · 중간이 약간 굵은 침체.","김침 중간 수업자료.pdf PDF 9쪽 (족보 모음의 구침 직접 설명 외 보충)"],["毫鍼(호침)","길이 3寸 6分. 鍼體는 털처럼 가늘며, 鍼尖은 모기 주둥이와 같은 형상이다.","털처럼 가는 침체 · 모기 주둥이 모양 침첨.","김침 중간 수업자료.pdf PDF 9~10쪽 (족보 모음의 구침 직접 설명 외 보충)"],["長鍼(장침)","길이 7寸. 鍼尖은 예리하고 鍼體는 가는 형상이다.","구침 중 길이가 긴 편 · 예리한 침첨과 가는 침체.","김침 중간 수업자료.pdf PDF 10쪽 (족보 모음의 구침 직접 설명 외 보충)"],["大鍼(대침)","길이 4寸. 鋒(鍼尖)이 약간 둥글어 점을 치는 댓가지와 비슷한 형상이다.","조금 둥글고 댓가지 같은 침첨 · 길이 4寸.","김침 중간 수업자료.pdf PDF 10쪽 (족보 모음의 구침 직접 설명 외 보충)"]]},{"id":"needles-use","title":"구침(九鍼) · 용도","page":"8–10","items":[["鑱鍼(참침)","陽分의 邪氣를 瀉한다. 피부를 淺刺하여 瀉血하고 頭部와 신체의 熱症을 치료한다.","陽分 사기 제거 · 피부 천자·사혈.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 4쪽 / 김침 중간 수업자료.pdf PDF 8쪽"],["圓鍼(원침)","分肉 사이를 문지르면서 肌肉을 손상시키지 않고, 分肉間의 氣滯와 邪氣를 치료한다.","문질러 분육의 기체를 풀되 기육은 손상하지 않음.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 3쪽 / 김침 중간 수업자료.pdf PDF 8쪽"],["鍉鍼(시침)","經脈을 按壓하되 피부 깊이 함입하지 않고 邪氣를 이끌어 내는 데 사용한다.","경맥을 누르되 깊이 자입하지 않음.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 3쪽 / 김침 중간 수업자료.pdf PDF 9쪽"],["鋒鍼(봉침)","痼疾을 흩어지게 한다. 주로 瀉血하여 癰腫과 熱病을 치료한다.","고질·옹종·열병에 사혈하며 후세 三稜鍼과 연결.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 3~4쪽 / 김침 중간 수업자료.pdf PDF 9쪽"],["鈹鍼(피침)","피부를 베어 大膿을 배출하고 癰膿 등의 외과병증을 치료한다.","절개·배농 · 외과용 割鍼에 해당.","본2-2 중간고사 김침 족보 모음_고.pdf PDF 4쪽 / 김침 중간 수업자료.pdf PDF 9쪽"],["圓利鍼(원리침)","深刺하여 癰腫·痺症을 치료하고, 痺氣가 갑자기 나타나는 暴氣를 다스린다.","심자 · 폭기·비증 치료.","김침 중간 수업자료.pdf PDF 9쪽 (족보 모음의 구침 직접 설명 외 보충)"],["毫鍼(호침)","서서히 刺鍼하고 오랫동안 留鍼하여 寒熱과 痛痺를 치료한다.","서서히 자침 · 장시간 유침 · 통비.","김침 중간 수업자료.pdf PDF 10쪽 (족보 모음의 구침 직접 설명 외 보충)"],["長鍼(장침)","깊이 자침하여 病邪가 깊은 곳에 있는 遠痺를 치료한다.","深刺 · 깊은 부위의 병증 · 遠痺.","김침 중간 수업자료.pdf PDF 10쪽 (족보 모음의 구침 직접 설명 외 보충)"],["大鍼(대침)","瀉水하여 관절의 질병을 치료한다. 호침보다 굵어 가열한 후 자침하기도 한다.","관절병의 사수(瀉水).","김침 중간 수업자료.pdf PDF 10쪽 (족보 모음의 구침 직접 설명 외 보충)"]]},{"id":"five","title":"오자(五刺)","page":"17–19","items":[["半刺(반자)","피부를 淺刺하고 빠르게 出鍼하며, 근육층에 닿지 않게 한다. 表邪를 치료하는 방법으로 肺와 상응한다.","부위: 皮 / 대응 오장: 肺 / 淺刺·빠른 출침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 7–8쪽",false],["豹文刺(표문자)","혈위 전후좌우를 散刺하여 細小血脈을 刺하고 경락의 鬱血을 방출한다. 心과 상응한다.","부위: 脈 / 대응 오장: 心 / 산자·사혈","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 7–8쪽",false],["關刺(관자)","사지관절 부근의 盡筋(건이 뼈에 부착하는 부위)에 刺하여 筋痺症을 치료한다. 肝과 상응한다.","부위: 筋 / 대응 오장: 肝 / 힘줄의 뼈 부착부","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 7–8쪽",false],["合谷刺(합곡자)","肌肉 중에 斜刺하여 鷄爪 형태와 같이 몇 개 방향에서 透刺한다. 脾와 상응한다.","부위: 肌肉 / 대응 오장: 脾 / 鷄爪形 다방향 투자","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 7–8쪽",false],["輸刺(수자)","수직으로 자침하고 발침하며 골격까지 深刺한다. 骨痺를 치료하고 腎과 상응한다.","부위: 骨 / 대응 오장: 腎 / 수직 자침·골격까지 심자","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 7–8쪽",false]]},{"id":"nine","title":"구자(九刺)","page":"20–21","items":[["兪刺(수자)","五臟에 병이 발생하면 해당 經絡의 肘膝關節 이하 滎穴과 兪穴을 취하고, 背部에서 상응하는 五臟兪(背兪穴)를 취한다.","配穴 원칙 / 五臟病 / 滎穴·兪穴·背兪穴","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["遠道刺(원도자)","병이 顔面이나 軀幹의 上部에 있으면 下肢의 穴位를 취한다. 六腑病에서는 하합혈(下合穴)을 활용한다.","遠位取穴 / 上病下取 / 六腑 하합혈","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["經刺(경자)","經脈이 소통하는 부위 중 氣血이 응체된 부분에 자침한다.","經脈에서 取穴 / 기혈 응체 부위","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["絡刺(낙자)","체표에서 鬱血된 細小絡脈을 刺하고 血絡을 瀉한다.","絡脈에서 取穴 / 세소락맥 사혈","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["分刺(분자)","침이 심층근육에 닿도록 깊게 자침하여 分肉之間을 刺한다.","分肉에서 取穴 / 심층근육","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["大瀉刺(대사자)","鈹鍼으로 화농된 癰疽를 절개하여 排膿한다.","외증의 고름을 瀉 / 외과적 절개·배농","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["毛刺(모자)","병소의 皮毛·皮膚表面에 淺刺하여 피부의 浮痺를 치료한다.","피부에서 取穴 / 浮痺·淺刺","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["巨刺(거자)","좌측에 병이 있으면 우측의 혈을, 우측에 병이 있으면 좌측의 혈을 취한다.","左右交叉取穴 / 左病右取·右病左取","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false],["焠刺(췌자)","침을 붉게 달궈 체표에 刺入하여 痺症을 치료한다.","痛處에서 取穴 / 燔鍼","본2-2 김침 암기표+15~20 족보_won.pdf PDF 1, 8–9쪽",false]]},{"id":"twelve","title":"십이자(十二刺)","page":"21–23","items":[["偶刺(우자)","손으로 전흉부를 압박하여 압통이 있는 부위를 찾고, 前(胸腹)에 一刺·後(背)에 一刺하여 병소에 대칭으로 자침한다.","主治: 心痺 / 앞뒤 각 한 침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["報刺(보자)","통증 부위가 일정하지 않고 위아래로 유주하는 경우에 자침한다. 자침 후 곧바로 발침하지 않고 왼손으로 病痛部를 안마한 뒤 다시 자침한다.","主治: 痛處가 일정하지 않고 上下로 流走 / 안마 후 재자침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["恢刺(회자)","筋腱의 측방에서 刺入하고, 筋腱의 전후 다방향으로 橫鍼透刺하여 연축을 완화한다.","主治: 筋痺 / 근건의 측방·다방향 투자","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["齊刺(제자)","正中에 한 침을 놓고 양측에 각각 한 침씩 자입하여 세 침을 나란하게 배열한다.","主治: 寒痺의 小深한 것 / 나란히 3침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["揚刺(양자)","正中에 한 침을 直刺하고 그 주변에 중심을 향하여 네 침을 橫鍼透刺한다.","主治: 寒痺의 廣大한 것 / 중앙 1+주변 4","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["直鍼刺(직침자)","혈위의 피부를 손끝으로 집고 피하를 따라 자입한다.","主治: 寒痺가 淺部에 있을 때 / 집어 올려 피하 자침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["輸刺(수자)","수직으로 深刺하고 완만하게 발침하여 氣盛·有熱한 熱性病을 치료한다.","主治: 熱性病 / 수직 심자·서서히 발침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["短刺(단자)","약간 요동시키면서 골격에 직접 닿도록 深刺하고, 골격 부근에서 침을 상하로 進退시킨다.","主治: 骨痺 / 골격 부근 상하로 진퇴","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["浮刺(부자)","斜刺하여 筋層을 향해 橫으로 透刺한다. 측방으로 淺刺하는 방법이다.","主治: 肌膚의 痙攣·寒邪 / 측방 천자·근층 투자","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["陰刺(음자)","좌우 양측의 상대되는 혈위(주로 陰經의 혈위)를 동시에 취혈하여 倂刺한다.","主治: 寒厥 / 좌우 대응 혈위","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["傍鍼刺(방침자)","直刺한 한 침 옆에 다른 한 침을 斜刺한다.","主治: 완고한 痺痛 / 직자 1침+옆 사자 1침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false],["贊刺(찬자)","수직으로 자침·발침하면서 여러 차례 淺刺하여 출혈을 목적으로 한다. 다수의 침으로 直刺直出하여 出血시킨다.","主治: 癰腫 / 다회 천자·출혈","본2-2 김침 암기표+15~20 족보_won.pdf PDF 2, 9쪽",false]]},{"id":"fourteen","title":"자침십사법(刺鍼十四法)","page":"27–29","items":[["動法(동법)","鍼을 刺入한 후 氣가 不行하면 침을 搖動시켜 氣를 伸提케 한다.","작용: 行氣","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["退法(퇴법)","拔鍼할 때 먼저 약간 退鍼하여 皮下에 잠시 留鍼한 후 補瀉法의 조작원칙에 따라 발침한다.","작용: 淸氣","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["搓法(차법)","刺鍼 후 새끼를 꼬듯 침을 外側 또는 內側으로 回轉시킨다. 左轉揷鍼하면 熱이 되고 右轉退鍼하면 寒이 된다고 한다.","작용: 寒熱","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["進法(진법)","刺鍼해도 氣가 不至하면 男은 外(左), 女는 內(右)로 염전하면서 進鍼한다.","작용: 助氣","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["盤法(반법)","腹部의 肉軟部位에 刺鍼하여 循環狀으로 다섯 번씩 회전한다. 左轉揷鍼은 補, 右轉退鍼은 瀉라고 한다.","작용: 補瀉","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["搖法(요법)","瀉法인 경우 拔鍼 시 반드시 搖動시키면서 退鍼한다.","작용: 瀉法","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["彈法(탄법)","補法인 경우 拇指의 爪甲으로 鍼尾를 가볍게 튕겨 氣를 빠르게 운행시킨다.","작용: 補氣","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["捻法(염법)","左轉은 補·右轉은 瀉가 된다고 하며, 上을 치료할 때 左轉하고 下를 치료할 때 右轉한다.","작용: 補瀉·行氣","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["循法(순법)","자극한 穴位의 經絡 분포경로를 손가락으로 上下로 문지른다.","작용: 氣血의 調和","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["捫法(문법)","補法인 경우 손가락으로 穴位를 눌러 막는다.","작용: 補法","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["攝法(섭법)","刺鍼後 氣가 澀滯하면 拇指·食指·中指의 爪甲으로 刺鍼한 經絡穴位를 往復按押한다.","작용: 宣氣","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["按法(안법)","刺鍼하여 緊張시켜 不進不退인 상태에서 손가락으로 鍼體를 굽혀 弓狀을 이룬다.","작용: 添氣 / 鍼體를 활처럼 굽힘","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["爪法(조법)","刺鍼할 때 손가락으로 穴位를 겨냥하여 爪甲으로 표를 하면 정확하게 자극할 수 있다.","작용: 取穴","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false],["切法(절법)","刺鍼하기 전에 拇指爪甲으로 穴位의 좌우를 눌렀다가 자침한다.","작용: 氣血을 散하게 함","본2-2 김침 암기표+15~20 족보_won.pdf PDF 3쪽",false]]},{"id":"parts","title":"호침의 구조","page":"33","items":[["鍼尖(침첨·침망)","鍼 선단의 뾰족한 부분이다. 일명 鍼芒이라고 한다.","鍼尖=鍼芒 / 침의 뾰족한 끝","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽",false],["鍼體(침체·침신)","鍼尖과 鍼柄 사이 부분이다. 毫鍼의 길이와 굵기는 주로 이 부분을 말한다. 일명 鍼身이다.","鍼體=鍼身 / 침첨과 침병 사이 몸통","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽",false],["鍼根(침근)","鍼體와 鍼柄이 만나는 부위이다.","鍼根 / 침체·침병 연결부","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽",false],["鍼柄(침병)","鍼體의 뒤쪽에서 금속선을 나선모양으로 감아 손가락으로 잡는 부분이다.","鍼柄 / 나선형 손잡이","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽",false],["鍼尾(침미)","鍼柄 말단에 금속선을 원형으로 꼬아 만들었으며 鍼尖과 정반대쪽 끝이다.","鍼尾 / 침병 말단","본2-2 김침 암기표+15~20 족보_won.pdf PDF 12쪽",false]]},{"id":"insert","title":"호침 진침법","page":"37","items":[["指切進鍼法(지절진침법)","손가락(指)으로 침을 지지하고 쓰러지지 않게 하면서 진침한다. 손톱 옆에서 자입한다.","손가락을 침에 붙여 지지하고 진침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽",false],["挾持進鍼法(협지진침법)","엄지와 검지로 鍼體를 잡아 지지하면서 침을 밀어 넣는다.","손가락으로 침체를 잡아 진침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽",false],["舒張進鍼法(서장진침법)","엄지와 검지로 자침할 피부를 펴서 팽팽하게 한 후 진침한다.","피부를 펼쳐 긴장시킨 후 자입","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽",false],["摘取進鍼法(적취진침법)","왼손 엄지와 검지로 자침부위 피부를 집어들고 오른손으로 자침한다. 뺨·이마 등 皮肉이 얇은 부위에 적용한다.","印堂穴에 사용 / 피부를 꼬집어 들고 자침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽",false],["單手進鍼法(단수진침법)","한 손의 엄지와 검지로 침병을 잡고 중지 끝으로 침체 하단을 받친 후 자입한다.","손 한쪽만 사용하는 진침입니다.","※ 첨부 암기표에 직접 설명 없음 / 기존 근거: 김침 중간 써머리.pdf PDF 37쪽",true],["管鍼進鍼法(관침진침법)","침관(鍼管)을 사용하여 진침한다.","침관을 대고 자침","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13–14쪽",false]]},{"id":"position","title":"상용 자침 체위","page":"35","items":[["仰坐位(앙좌위)","頭部顔面·頸部·胸部 등의 혈위에 적용되는 앉은 자세이다.","머리·안면·경부·흉부","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13쪽",false],["伏坐位(복좌위)","頭頂部·項部·背部 등의 혈위에 적용되는 앉은 자세이다.","두정부·뒷목·등","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13쪽",false],["側臥位(측와위)","側身部에서 少陽經 위주의 혈위에 적용되는 옆으로 누운 자세이다.","측신부·소양경","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13쪽",false],["仰臥位(앙와위)","신체 전면의 任脈·足三陰·陽明經 등의 혈위에 적용되는 바로 누운 자세이다.","몸 전면·임맥·족삼음·양명","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13쪽",false],["伏臥位(복와위)","腰背部의 督脈·太陽經 혈위에 적용되는 엎드린 자세이다.","요배부·독맥·태양경","본2-2 김침 암기표+15~20 족보_won.pdf PDF 13쪽",false]]},{"id":"angle","title":"호침 자침 각도","page":"37–38","items":[["直刺(직자)","피부와 90° 또는 수직에 가까운 각도로 자입하는 일반적인 자침 방향이다.","근육이 풍부한 혈위에 상용","본2-2 김침 암기표+15~20 족보_won.pdf PDF 14쪽",false],["斜刺(사자)","피부와 30~60° 각도로 자입한다. 골격변연이나 深刺할 수 없는 혈위 등에 운용한다.","골격변연·근육층 자극· const OPTIONAL=new Set(["assist","handle","transport"]);
let selectedCategory="all", includeExtra=false, mode="quiz", shuffle=true, queue=[],cursor=0,failed=[],phase=1,choice=null,completed=0,correct=0;
const $=id=>document.getElementById(id);
const allEntries=()=>GROUPS.filter(g=>includeExtra||!OPTIONAL.has(g.id)).flatMap(g=>g.items.map((a,i)=>({id:g.id+'-'+i,group:g,term:a[0],definition:a[1],tip:a[2],source:a[3],supplemental:a[4]===true})).filter(q=>includeExtra||!q.supplemental));
const entries=()=>allEntries().filter(q=>selectedCategory==="all"||q.group.id===selectedCategory);
function randomize(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function shuffled(items){return shuffle?randomize(items):items.slice()}
function reset(){optionMemo.clear();queue=shuffled(entries());cursor=0;failed=[];phase=1;choice=null;completed=0;correct=0;render();}
function notifySize(){requestAnimationFrame(()=>{const h=Math.ceil(document.documentElement.scrollHeight);parent!==window&&parent.postMessage({type:'kimchim-size',height:h},location.origin)})}
function setCategory(id){selectedCategory=id;reset();}
function renderNav(){const nav=$("groupNav");nav.replaceChildren();
 const add=(name,id,count)=>{const b=document.createElement("button");b.textContent=name+" · "+count;b.className=id===selectedCategory?"active":"";b.onclick=()=>setCategory(id);nav.appendChild(b)};
 const groups=GROUPS.filter(x=>includeExtra||!OPTIONAL.has(x.id)),visible=allEntries();add("전체","all",visible.length);for(const g of groups){const n=visible.filter(q=>q.group.id===g.id).length;if(n)add(g.title,g.id,n);}
 const b=document.createElement("button");b.textContent=includeExtra?"추가 범주 숨기기":"추가 범주·수업자료 보충 보기";b.setAttribute("aria-pressed",String(includeExtra));b.onclick=()=>{includeExtra=!includeExtra;selectedCategory="all";reset()};nav.appendChild(b);
}
const lastAnswerPositions=new Map();
function getOptions(q){
 const pool=q.group.items.filter(e=>includeExtra||e[4]!==true).map(e=>e[0]).filter(x=>x!==q.term);
 const options=randomize([q.term,...randomize(pool).slice(0,Math.min(3,pool.length))]);
 const previous=lastAnswerPositions.get(q.id);
 if(options.length>1&&Number.isInteger(previous)&&options.indexOf(q.term)===previous){
  const alternative=randomize(options.map((_,i)=>i).filter(i=>i!==previous))[0];
  [options[previous],options[alternative]]=[options[alternative],options[previous]];
 }
 lastAnswerPositions.set(q.id,options.indexOf(q.term));
 return options;
}
const optionMemo=new Map();
function optionsFor(q){if(!optionMemo.has(q.id))optionMemo.set(q.id,getOptions(q));return optionMemo.get(q.id)}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function saveResult(q,ok){try{const k='kimchim-quiz-history-v1';const a=JSON.parse(localStorage.getItem(k)||'{}');const m=a[q.id]||{right:0,wrong:0};m[ok?'right':'wrong']++;a[q.id]=m;localStorage.setItem(k,JSON.stringify(a))}catch{}}
function answer(ix){if(choice!==null||cursor>=queue.length)return;const q=queue[cursor],opts=optionsFor(q);choice=ix;const ok=opts[ix]===q.term;completed++;if(ok)correct++;else if(!failed.find(x=>x.id===q.id))failed.push(q);saveResult(q,ok);renderQuestion();parent!==window&&parent.postMessage({type:'kimchim-focus-grade',top:0,explanationTop:450},location.origin)}
function advance(){if(choice===null){return;}cursor++;choice=null;optionMemo.clear();if(cursor>=queue.length){if(phase===1&&failed.length){queue=shuffled(failed);failed=[];phase=2;cursor=0;}}render();}
function renderQuestion(){const host=$('quiz');host.replaceChildren();
 if(cursor>=queue.length){const box=make('div','card summary');box.appendChild(make('h2','',phase===2?'오답 재학습 완료':'첫 회차 완료'));box.appendChild(make('p','',phase===1?'이번 회차의 문항을 모두 풀었습니다.':'틀렸던 문항을 한 번 더 복습했습니다.'));const b=make('button','primary','다시 시작');b.onclick=reset;box.appendChild(b);host.appendChild(box);return}
 const q=queue[cursor],opts=optionsFor(q),done=choice!==null,yes=done&&opts[choice]===q.term;
 const box=make('div','card');box.appendChild(make('div','crumb',q.group.title));const line=make('div','progressline');const inner=make('span');inner.style.width=(queue.length?cursor/queue.length*100:0)+'%';line.appendChild(inner);box.appendChild(line);
 box.appendChild(make('div','meta',(phase===1?'1회차':'오답 복습')+' · '+(cursor+1)+' / '+queue.length+' · 설명에 해당하는 명칭을 고르세요.'));
 box.appendChild(make('div','question',q.definition));
 const optsHost=make('div','options');opts.forEach((name,i)=>{const b=make('button','option');b.type='button';b.disabled=done;b.appendChild(make('b','',String(i+1).padStart(2,'0')));b.appendChild(make('span','',name));if(done&&name===q.term)b.classList.add('correct');if(done&&i===choice&&!yes)b.classList.add('incorrect');b.onclick=()=>answer(i);optsHost.appendChild(b)});box.appendChild(optsHost);
 if(done){const fb=make('div','feedback');fb.appendChild(make('h3',yes?'O · 정답입니다':'X · 오답입니다'));fb.appendChild(make('p','', '정답: '+q.term));fb.appendChild(make('p','why','구별 포인트: '+q.tip));fb.appendChild(make('p','source','근거: '+(q.source||'김침 중간 써머리.pdf PDF '+q.group.page+'쪽')));box.appendChild(fb)}
 const foot=make('div','foot');foot.appendChild(make('span','meta','숫자키 1–4 선택 · Enter 다음'));const next=make('button','primary',done?'다음 문제 (Enter)':'선지를 선택하세요');next.disabled=!done;next.onclick=advance;foot.appendChild(next);box.appendChild(foot);host.appendChild(box);
}
function renderList(){const host=$('list');host.replaceChildren();for(const q of entries()){const box=make('article','listitem');box.appendChild(make('span','tag',q.group.title));box.appendChild(make('h3','',q.term));box.appendChild(make('p','',q.definition));box.appendChild(make('p','desc',q.tip));box.appendChild(make('p','source',(q.source||'김침 중간 써머리.pdf PDF '+q.group.page+'쪽')));host.appendChild(box)}}
function render(){renderNav();$('quiz').hidden=mode!=='quiz';$('list').hidden=mode!=='list';$('quizBtn').setAttribute('aria-pressed',String(mode==='quiz'));$('listBtn').setAttribute('aria-pressed',String(mode==='list'));$('statCount').innerHTML='현재 문항 <strong>'+entries().length+'</strong>개';$('statPhase').textContent=phase===1?'첫 회차':'오답 복습';$('statCorrect').textContent='맞힌 횟수 '+correct+' / '+completed;
 if(mode==='quiz')renderQuestion();else renderList();notifySize()}
$('quizBtn').onclick=()=>{mode='quiz';render()};$('listBtn').onclick=()=>{mode='list';render()};
$('resetBtn').onclick=()=>{optionMemo.clear();reset()};
$('shuffleBtn').onclick=()=>{shuffle=!shuffle;optionMemo.clear();$('shuffleBtn').textContent=shuffle?'문제 순서 섞기 ✓':'문제 순서대로';reset()};
window.addEventListener('keydown',e=>{if(mode!=='quiz'||e.isComposing||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 if(/^[1-4]$/.test(e.key)&&choice===null){const q=queue[cursor];if(!q)return;const i=Number(e.key)-1;if(i<optionsFor(q).length){e.preventDefault();answer(i)}}else if(e.key==='Enter'&&choice!==null){e.preventDefault();advance();}});
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;const d=e.data;if(d.type==='kimchim-key'){const ke=new KeyboardEvent('keydown',{key:d.key,bubbles:true});window.dispatchEvent(ke)}});
if('ResizeObserver' in window)new ResizeObserver(notifySize).observe(document.body);
reset();
</script></body></html>
