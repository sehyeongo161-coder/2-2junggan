</div><script>
const GROUPS=[{"id":"needles","title":"구침(九鍼) — 침의 종류","page":"12–13","items":[["鑱鍼(참침)","침두가 크고 침첨이 예리하며, 피부를 얕게 찔러 사혈하여 양분의 사기 및 두부·신체의 열증을 치료한다.","화살촉 모양의 후세 전두침과 연결됩니다."],["圓鍼(원침)","침첨이 달걀처럼 둥글고 침체는 원주형이다. 분육 사이를 문질러 기체를 치료하며 기육을 손상시키지 않는다.","찌르는 침이 아니라 분육을 문지르는 침입니다."],["鍉鍼(시침)","침첨이 곡식 낟알처럼 둥글면서 뾰족하다. 경맥을 눌러 사기를 이끌어 내지만 피부 깊이 자입하지 않는다.","경맥을 안압하는 데 사용하는 침입니다."],["鋒鍼(봉침)","침첨에 세 개의 칼날이 있어 사혈로 옹종·열병·고질을 치료한다.","후세 삼릉침의 전신에 해당합니다."],["鈹鍼(피침)","끝이 칼날·검봉 모양이고 폭이 넓다. 화농된 옹농을 절개해 큰 고름을 배출한다.","외과적 메스와 비슷한 역할입니다."],["圓利鍼(원리침)","침첨이 둥글면서 예리하고 중간 부분이 다소 굵다. 깊게 찔러 갑자기 발생한 비기를 치료한다.","급성으로 나타나는 비증과 관련됩니다."],["毫鍼(호침)","침체가 털처럼 가늘고 침첨은 모기 주둥이와 같다. 서서히 자침하고 오래 유침해 통비 및 한열병증을 치료한다.","오늘날 일반적인 자침의 대표 도구입니다."],["長鍼(장침)","침체가 가늘고 길이가 약 7촌이다. 깊은 곳의 원비·심부 병사를 치료한다.","후세의 환도침과 연결됩니다."],["大鍼(대침)","침첨이 비교적 둥글고 굵다. 관절 질환에서 물을 빼는 사수(瀉水)에 사용한다.","길이보다 굵기·사수 용도를 구분하세요."]]},{"id":"five","title":"오자(五刺)","page":"17–19","items":[["半刺(반자)","피부를 매우 얕게 찌르고 재빨리 발침하며 근육층에 이르지 않는다. 폐와 상응한다.","폐주피모·피부 천자가 핵심입니다."],["豹文刺(표문자)","통증부위 전후좌우를 산자하여 작은 혈맥에서 어혈을 방출한다. 출혈점이 표범무늬처럼 보이고 심과 상응한다.","심주혈맥, 사혈, 여러 곳의 출혈점으로 구별합니다."],["關刺(관자)","사지 관절 부근 힘줄이 뼈에 부착하는 부위를 자침한다. 근비·근육구급 치료에 쓰고 간과 상응한다.","간주근, 건 부착부 및 관절 부근이 핵심입니다."],["合谷刺(합곡자)","근육이 풍부한 부위에 직자하여 득기한 뒤 피하로 후퇴시켜 좌우 여러 방향으로 사자한다. 형태가 닭발톱과 같다.","비주기육·계조(鷄爪) 모양의 다방향 자침입니다."],["輸刺(수자)","침을 수직으로 찔러 골격까지 깊이 자입한 뒤 발침한다. 골비 및 심부병증에 사용하고 신과 상응한다.","신주골. 십이자의 동명 수자와 발침 방식·대상을 구별하세요."]]},{"id":"nine","title":"구자(九刺)","page":"20–21","items":[["兪刺(수자)","오장병에 해당 경락의 주슬관절 이하 형혈·수혈과 배부의 해당 장부 배수혈을 함께 취한다.","오장 질환에서 배수혈과 형·수혈을 배합하는 배혈원칙입니다."],["遠道刺(원도자)","상부의 병증에 아래쪽 먼 곳의 혈을 취한다. 특히 육부병에 하합혈을 사용하는 원위취혈법이다.","상병하취·육부하합혈을 기억하세요."],["經刺(경자)","경맥의 유주를 따라 압진하여 기혈이 응체된 경결 부위에 침을 놓아 경기를 소통시킨다.","순경취혈과 경맥 기혈의 울체가 핵심입니다."],["絡刺(낙자)","체표에 울혈된 세소락맥을 얕게 자침해 피를 내보낸다.","표문자·찬자와 유사하지만 구자의 자락맥 사혈입니다."],["分刺(분자)","침첨이 뼈와 가까운 심층근육인 분육까지 도달하도록 깊게 찔러 마비·위축·경련·산통을 치료한다.","구자의 분자(分刺): 깊은 근육층 자침입니다."],["大瀉刺(대사자)","칼날 모양의 피침으로 화농된 옹저를 절개하여 고름을 배출한다.","절개·배농과 鈹鍼(피침)을 연결하세요."],["毛刺(모자)","병소의 피부 표면·피모를 매우 얕게 자침해 마목불인과 부비 등 피부병을 치료한다.","오자의 반자와 비슷한 피부층 자침입니다."],["巨刺(거자)","왼쪽 병에는 오른쪽, 오른쪽 병에는 왼쪽의 대응 혈위를 취한다.","좌병우치·우병좌치. 무자와의 세부 차이는 별도로 학습합니다."],["焠刺(췌자)","침을 붉게 달군 뒤 체표에 재빨리 자입·발침하여 한비를 치료한다.","화침. 침을 넣은 뒤 달구는 온침과 다릅니다."]]},{"id":"twelve","title":"십이자(十二刺)","page":"21–23","items":[["偶刺(우자)","흉부의 압통 부위를 찾은 뒤 앞가슴에 한 침, 등에 한 침을 놓아 심비병을 치료한다.","전후배혈·음양자. 수모배혈의 선행 형태입니다."],["報刺(보자)","통증 부위가 옮겨 다닐 때 압통점에 자침하고 주변을 안마한 다음 발침하여 다시 압통점을 찾아 재차 자침한다.","자침 → 발침 → 다시 자침하는 반복입니다."],["恢刺(회자)","근건의 측방으로 찌른 후 힘줄의 앞뒤 여러 방향으로 횡투자하여 구축과 경련을 풀어준다.","힘줄·근건의 연축에 대한 다방향 횡투자입니다."],["齊刺(제자)","환부 중앙에 한 침을 놓고 양옆에 하나씩 놓아 세 침을 나란하게 배치한다.","세 개의 침을 함께 쓰므로 삼자라고도 합니다."],["揚刺(양자)","중앙에 직자한 한 침 주위에서 중심을 향해 네 개의 침을 횡투자한다.","총 다섯 침. 비교적 얕고 범위가 넓은 비증에 사용합니다."],["直鍼刺(직침자)","피부를 손가락으로 집어 들어 침을 피부 밑으로 수평 방향에 가깝게 자입한다.","이름과 달리 일반적인 수직 직자가 아니라 피하를 따르는 횡자입니다."],["輸刺(수자)","수직으로 깊게 찌른 다음 천천히 발침해 열사를 사하고 열성병을 치료한다.","오자의 수자와 동명이지만 열성병·완만한 발침이 특징입니다."],["短刺(단자)","약간 흔들며 깊이 자침해 뼈에 접근·접촉한 뒤 골격 부근에서 침을 위아래로 진퇴시킨다.","단(短)은 짧게 놓는다는 뜻이 아니라 뼈에 접근한다는 뜻입니다."],["浮刺(부자)","비스듬히 찌른 후 근육층을 향해 침을 수평으로 투자한다. 자극 위치가 비교적 얕다.","근육층을 겨냥하는 사자·횡투자입니다."],["陰刺(음자)","좌우 양측의 서로 대응하는 혈위를 동시에 취하여 음한성 질환을 치료한다.","좌우배혈. 우자의 전후배혈과 대비하세요."],["傍鍼刺(방침자)","환부에 한 침을 곧게 꽂고, 그 곁에 다른 침 한 개를 비스듬히 꽂는다.","직자 한 침 + 옆에서 사자 한 침, 총 두 개입니다."],["贊刺(찬자)","여러 차례 얕게 직자하고 반복해 발침하면서 출혈시켜 옹종을 흩어준다.","얕은 직자·다회 사혈이 핵심입니다."]]},{"id":"fourteen","title":"자침십사법(刺鍼十四法)","page":"27–29","items":[["動法(동법)","자침 후 기가 움직이지 않을 때 침을 흔들어 기를 움직이게 한다.","행기 목적, 후대 청룡파미법으로 발전합니다."],["退法(퇴법)","발침 전에 일단 약간 퇴침하여 피하에 잠시 유침했다가 천천히 발침한다.","점진적인 발침으로 출혈을 줄이는 방식입니다."],["搓法(차법)","자침 뒤 새끼를 꼬듯 외측 또는 내측으로 크게 돌린다. 고전에서는 좌전삽침=열, 우전퇴침=한으로 설명한다.","강한 염전 자극은 활용되나 좌우의 한열 배당은 임상가치가 없다고 강의합니다."],["進法(진법)","자침했는데 득기하지 못했을 때 고전에서는 남자는 외측, 여자는 내측으로 염전하면서 더 진침한다.","남녀 좌우 구분은 실용성이 없고 염전 진침의 최기작용을 설명합니다."],["盤法(반법)","복부의 부드러운 살에 자침하고 침꼬리를 원형으로 360도씩 약 5회 회전한다.","복부·큰 원형 회전. 좌삽우퇴 보사설은 강의에서 실용성이 낮다고 평가합니다."],["搖法(요법)","사법으로 발침할 때 침을 흔들거나 크게 요동시키면서 퇴침한다.","요동 발침, 강자극과 연관됩니다."],["彈法(탄법)","보법에서 엄지손톱으로 침꼬리를 가볍게 튕겨 기의 운행을 촉진한다.","침꼬리를 톡톡 튕기는 동작입니다."],["捻法(염법)","고전 설명에서 왼쪽으로 돌리면 보하고 오른쪽으로 돌리면 사한다고 한다.","좌전보·우전사설은 강의에서 실제 가치는 없다고 평가합니다."],["循法(순법)","자침한 혈위가 속한 경락의 분포 경로를 따라 손가락으로 위아래 문질러 기혈을 조화한다.","득기 불충분 시 보조적으로 활용합니다."],["捫法(문법)","보법으로 발침한 후 손가락을 이용해 해당 혈위를 눌러 침구멍을 막는다.","발침 후 지혈과 개합보사에 관련됩니다."],["攝法(섭법)","자침 후 기가 정체되면 엄지·검지·중지 손톱으로 해당 경락의 혈위를 왕복하여 누른다.","지체된 경기를 소통시키는 손톱 왕복 압박입니다."],["按法(안법)","침이 들어간 상태에서 손가락으로 침체를 굽혀 활 모양으로 만들어 자극을 강화한다.","자침십사법의 안(按/弩): 침체를 휘는 조작입니다."],["爪法(조법)","손톱으로 혈위를 겨냥해 표시한 뒤 정확한 위치를 찾고 자침한다.","취혈 표시·정확한 혈위 선택이 목적입니다."],["切法(절법)","자침 전 엄지손톱으로 혈위 좌우를 눌러 혈관 손상을 피하고 통증을 감소시킨다.","진침 전 손톱 압박 동작입니다."]]},{"id":"parts","title":"호침의 구조","page":"33","items":[["鍼尖(침첨·침망)","호침의 가장 앞쪽에 있는 뾰족한 끝부분이다.","이상적인 침첨은 너무 지나치게 날카롭지 않고 솔잎 끝과 비슷합니다."],["鍼體(침체·침신)","호침에서 침첨과 침병 사이의 긴 몸통 부분이다. 주로 길이와 굵기를 기준으로 규격을 구분한다.","침체는 손으로 잡는 침병과 다릅니다."],["鍼根(침근)","호침에서 침체와 침병이 서로 연결되는 경계 부분이다.","이음부가 부식·파손되면 절침의 위험이 있습니다."],["鍼柄(침병)","손가락으로 잡는 부분으로, 침체의 뒤쪽에 금속선을 나선형으로 감은 부위이다.","염전·제삽 시 파지하는 곳입니다."],["鍼尾(침미)","침병 맨 끝의 부위로, 일반적으로 금속선을 둥글게 꼬았고 온침의 애융을 끼울 수 있다.","가장 뒤쪽에 해당합니다."]]},{"id":"insert","title":"호침 진침법","page":"37","items":[["指切進鍼法(지절진침법)","압수 손가락의 손톱으로 혈위를 눌러 침을 손톱 옆에 붙여서 자입한다. 주로 짧은 침을 육후한 곳에 쓴다.","손톱으로 눌러 지지하며 진침합니다."],["挾持進鍼法(협지진침법)","왼손으로 침체 아래쪽을 받쳐 쥐고 오른손과 함께 힘을 주어 깊게 진침한다. 3촌 이상의 긴 침에 적합하다.","장침 사용·침체를 양손으로 받치는 것이 핵심입니다."],["舒張進鍼法(서장진침법)","압수 두 손가락으로 자침 부위의 피부를 팽팽하게 펼친 상태에서 진침한다.","느슨하고 주름진 피부의 자침에 사용합니다."],["摘取進鍼法(적취진침법)","엄지와 검지로 피부를 집어 들어 올리고 그 부위에 자침한다. 얼굴처럼 피육이 얇은 곳에 사용한다.","피부를 집어 올리는 것과 피부를 펴는 것을 구별합니다."],["單手進鍼法(단수진침법)","한 손의 엄지와 검지로 침병을 잡고 중지 끝으로 침체 하단을 받친 후 자입한다.","손 한쪽만 사용하는 진침입니다."],["管鍼進鍼法(관침진침법)","침관 안에 호침을 넣어 혈위 위에 대고 튀어나온 침병을 빠르게 두드려 피부를 통과시킨다.","침관을 이용해 통증을 줄이는 방식입니다."]]},{"id":"position","title":"상용 자침 체위","page":"35","items":[["仰坐位(앙좌위)","머리·안면·경부·상완부 등을 취혈할 때 얼굴을 위로 향해 앉는 자세이다.","위를 보고 앉음."],["伏坐位(복좌위)","머리 꼭대기·뒷목·등 등의 혈위를 취할 때 상체와 머리를 앞으로 숙여 앉는다.","고개를 숙여 앉음."],["側臥位(측와위)","몸의 옆면, 특히 소양경의 혈위를 취하기 위해 옆으로 눕는다.","옆으로 누운 체위입니다."],["仰臥位(앙와위)","몸 앞면의 임맥·족삼음·양명경 혈위에 접근하도록 똑바로 등을 대고 눕는다.","얼굴을 위로 하고 눕는 체위입니다."],["伏臥位(복와위)","등·허리의 독맥 및 태양경 혈위를 취하기 위해 엎드린다.","등허리와 독맥·태양경이 단서입니다."]]},{"id":"angle","title":"호침 자침 각도","page":"37–38","items":[["直刺(직자)","피부면과 약 90도 또는 수직에 가깝게 자입한다.","근육이 풍부한 부위에 흔히 사용합니다."],["斜刺(사자)","피부면과 약 30~60도의 비스듬한 각도로 자입한다.","골격 변연과 깊이 찌를 수 없는 혈위에 활용합니다."],["橫刺(횡자)","피부면과 약 15도로 얕게, 피부를 따라 거의 평행하게 자입한다.","연피자(沿皮刺), 두부·표재성 혈위·투혈에 사용합니다."]]},{"id":"transport","title":"투혈자법","page":"31","items":[["直透法(직투법)","사지의 내외측 또는 전후측에서 서로 대응하는 두 혈위를 서로 관통하도록 투자한다.","서로 맞은편인 대응 혈위 사이의 투자입니다."],["橫透法(횡투법)","동일 부위에서 위아래 또는 앞뒤 관계에 있는 두 혈위 사이를 투자한다.","상하·전후로 연결된 혈위 사이의 투자입니다."]]},{"id":"stimulation","title":"도기법의 운침 유형","page":"39–40","items":[["間歇運鍼法(간헐운침법)","득기 후 유침하면서 수분 간격으로 제삽·염전을 한 차례씩 여러 번 반복한다.","간격을 두고 간헐적으로 자극합니다."],["持續運鍼法(지속운침법)","득기 후 쉬지 않고 연속으로 제삽 또는 염전을 일정 시간 시행해 증상 완화나 치료 목표에 도달한다.","중간에 쉬지 않고 계속 자극합니다."]]},{"id":"assist","title":"호침 자침 전후 보조수법 · 추가","page":"40","items":[["爪法(조법)","진침하기 전에 손톱으로 취혈 부위를 표시하거나 주변 조직을 밀어 정확한 혈위를 고정한다.","전 단계·손톱으로 취혈."],["切法(절법)","진침 전 혈위 사방을 눌러 기혈을 선산시킨 뒤 자침한다.","자침 전 누르기, 조법과 연결됩니다."],["循法(순법)","자침 후 득기가 늦으면 세 손가락 지면으로 혈위의 위아래를 문질러 기를 이끈다.","손가락 지면으로 상하 문지름."],["攝法(섭법)","기가 삽체하면 엄지·검지·중지의 손톱으로 경락을 따라 왕복하며 문지른다.","손톱으로 왕복 압박."],["捫法(문법)","발침 후 혈위를 손가락으로 막아 기가 새지 않도록 하고 지혈한다.","발침 후 침공을 막음."],["按法(안법)","자입된 침의 위 또는 아래쪽을 눌러 침감이 원하는 방향으로 전도되게 한다.","상행시키려면 하방, 하행시키려면 상방을 누릅니다."]]},{"id":"handle","title":"호침 행침보조수법 · 추가","page":"41","items":[["彈法(탄법)","유침 중 손가락으로 침병을 가볍게 튕겨 진동시켜 득기의 감응을 강화한다.","침병을 튕김."],["刮法(괄법)","엄지 또는 검지 손톱으로 침병을 긁어서 침체를 진동시킨다.","침병을 손톱으로 긁음."],["弩法(노법)","침병을 고정한 상태에서 중지로 침체를 활처럼 부드럽게 휘어 침감을 전도한다.","침체를 활 모양으로 굽힘."],["動法(동법)","득기하지 못할 때 방울을 흔들듯 침을 요동시켜 감응을 강화한다.","방울처럼 흔들어 움직임."],["搖法(요법)","침을 뺄 때 흔들면서 침공을 크게 요동시킨다.","흔들면서 발침."],["盤法(반법)","복부에 침을 놓고 침꼬리를 커다란 원형으로 돌리는 방법이다.","복부에서 원형 회전."],["搓法(차법)","실을 비비듯 침을 돌려 열감을 유도한다.","실 꼬듯 염전."],["飛法(비법)","큰 폭으로 연속 세 번 염전한 뒤 엄지와 검지를 벌려 새가 날개를 펴는 듯한 동작을 한다.","새 날개를 펴는 동작."],["震法(진법)","작은 폭으로 경미하게 흔들면서 제삽·염전을 하여 손이 떠는 듯한 진동을 만든다.","미세 진동·전동."]]}];

let selectedCategory="all", includeExtra=false, mode="quiz", shuffle=true, queue=[],cursor=0,failed=[],phase=1,choice=null,completed=0,correct=0;
const $=id=>document.getElementById(id);
const allEntries=()=>GROUPS.filter(g=>includeExtra||!OPTIONAL.has(g.id)).flatMap(g=>g.items.map((a,i)=>({id:g.id+'-'+i,group:g,term:a[0],definition:a[1],tip:a[2]})));
const entries=()=>allEntries().filter(q=>selectedCategory==="all"||q.group.id===selectedCategory);
function shuffled(items){const a=items.slice();if(shuffle)for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function reset(){queue=shuffled(entries());cursor=0;failed=[];phase=1;choice=null;completed=0;correct=0;render();}
function notifySize(){requestAnimationFrame(()=>{const h=Math.ceil(document.documentElement.scrollHeight);parent!==window&&parent.postMessage({type:'kimchim-size',height:h},location.origin)})}
function setCategory(id){selectedCategory=id;reset();}
function renderNav(){const nav=$("groupNav");nav.replaceChildren();
 const add=(name,id,count)=>{const b=document.createElement("button");b.textContent=name+" · "+count;b.className=id===selectedCategory?"active":"";b.onclick=()=>setCategory(id);nav.appendChild(b)};
 const groups=GROUPS.filter(x=>includeExtra||!OPTIONAL.has(x.id));add("전체", "all",groups.reduce((a,b)=>a+b.items.length,0));for(const g of groups)add(g.title,g.id,g.items.length);
 const b=document.createElement("button");b.textContent=includeExtra?"추가 범주 숨기기":"추가 범주 보기";b.setAttribute("aria-pressed",String(includeExtra));b.onclick=()=>{includeExtra=!includeExtra;selectedCategory="all";reset()};nav.appendChild(b);
}
function getOptions(q){const pool=q.group.items.map(e=>e[0]).filter(x=>x!==q.term);return shuffled([q.term,...shuffled(pool).slice(0,Math.min(3,pool.length))]);}
const optionMemo=new Map();
function optionsFor(q){if(!optionMemo.has(q.id))optionMemo.set(q.id,getOptions(q));return optionMemo.get(q.id)}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function saveResult(q,ok){try{const k='kimchim-quiz-history-v1';const a=JSON.parse(localStorage.getItem(k)||'{}');const m=a[q.id]||{right:0,wrong:0};m[ok?'right':'wrong']++;a[q.id]=m;localStorage.setItem(k,JSON.stringify(a))}catch{}}
function answer(ix){if(choice!==null||cursor>=queue.length)return;const q=queue[cursor],opts=optionsFor(q);choice=ix;const ok=opts[ix]===q.term;completed++;if(ok)correct++;else if(!failed.find(x=>x.id===q.id))failed.push(q);saveResult(q,ok);renderQuestion();parent!==window&&parent.postMessage({type:'kimchim-focus-grade',top:0,explanationTop:450},location.origin)}
function advance(){if(choice===null){return;}cursor++;choice=null;if(cursor>=queue.length){if(phase===1&&failed.length){queue=shuffled(failed);failed=[];phase=2;cursor=0;optionMemo.clear();}}render();}
function renderQuestion(){const host=$('quiz');host.replaceChildren();
 if(cursor>=queue.length){const box=make('div','card summary');box.appendChild(make('h2','',phase===2?'오답 재학습 완료':'첫 회차 완료'));box.appendChild(make('p','',phase===1?'이번 회차의 문항을 모두 풀었습니다.':'틀렸던 문항을 한 번 더 복습했습니다.'));const b=make('button','primary','다시 시작');b.onclick=reset;box.appendChild(b);host.appendChild(box);return}
 const q=queue[cursor],opts=optionsFor(q),done=choice!==null,yes=done&&opts[choice]===q.term;
 const box=make('div','card');box.appendChild(make('div','crumb',q.group.title));const line=make('div','progressline');const inner=make('span');inner.style.width=(queue.length?cursor/queue.length*100:0)+'%';line.appendChild(inner);box.appendChild(line);
 box.appendChild(make('div','meta',(phase===1?'1회차':'오답 복습')+' · '+(cursor+1)+' / '+queue.length+' · 설명에 해당하는 명칭을 고르세요.'));
 box.appendChild(make('div','question',q.definition));
 const optsHost=make('div','options');opts.forEach((name,i)=>{const b=make('button','option');b.type='button';b.disabled=done;b.appendChild(make('b','',String(i+1).padStart(2,'0')));b.appendChild(make('span','',name));if(done&&name===q.term)b.classList.add('correct');if(done&&i===choice&&!yes)b.classList.add('incorrect');b.onclick=()=>answer(i);optsHost.appendChild(b)});box.appendChild(optsHost);
 if(done){const fb=make('div','feedback');fb.appendChild(make('h3',yes?'O · 정답입니다':'X · 오답입니다'));fb.appendChild(make('p','', '정답: '+q.term));fb.appendChild(make('p','why','구별 포인트: '+q.tip));fb.appendChild(make('p','source','근거: 김침 중간 써머리.pdf PDF '+q.group.page+'쪽'));box.appendChild(fb)}
 const foot=make('div','foot');foot.appendChild(make('span','meta','숫자키 1–4 선택 · Enter 다음'));const next=make('button','primary',done?'다음 문제 (Enter)':'선지를 선택하세요');next.disabled=!done;next.onclick=advance;foot.appendChild(next);box.appendChild(foot);host.appendChild(box);
}
function renderList(){const host=$('list');host.replaceChildren();for(const q of entries()){const box=make('article','listitem');box.appendChild(make('span','tag',q.group.title));box.appendChild(make('h3','',q.term));box.appendChild(make('p','',q.definition));box.appendChild(make('p','desc',q.tip));box.appendChild(make('p','source','김침 중간 써머리.pdf PDF '+q.group.page+'쪽'));host.appendChild(box)}}
function render(){renderNav();$('quiz').hidden=mode!=='quiz';$('list').hidden=mode!=='list';$('quizBtn').setAttribute('aria-pressed',String(mode==='quiz'));$('listBtn').setAttribute('aria-pressed',String(mode==='list'));$('statCount').innerHTML='현재 문항 <strong>'+entries().length+'</strong>개';$('statPhase').textContent=phase===1?'첫 회차':'오답 복습';$('statCorrect').textContent='맞힌 횟수 '+correct+' / '+completed;
 if(mode==='quiz')renderQuestion();else renderList();notifySize()}
$('quizBtn').onclick=()=>{mode='quiz';render()};$('listBtn').onclick=()=>{mode='list';render()};
$('resetBtn').onclick=()=>{optionMemo.clear();reset()};
$('shuffleBtn').onclick=()=>{shuffle=!shuffle;optionMemo.clear();$('shuffleBtn').textContent=shuffle?'순서 섞기 ✓':'순서대로';reset()};
window.addEventListener('keydown',e=>{if(mode!=='quiz'||e.isComposing||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 if(/^[1-4]$/.test(e.key)&&choice===null){const q=queue[cursor];if(!q)return;const i=Number(e.key)-1;if(i<optionsFor(q).length){e.preventDefault();answer(i)}}else if(e.key==='Enter'&&choice!==null){e.preventDefault();advance();}});
window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;const d=e.data;if(d.type==='kimchim-key'){const ke=new KeyboardEvent('keydown',{key:d.key,bubbles:true});window.dispatchEvent(ke)}});
if('ResizeObserver' in window)new ResizeObserver(notifySize).observe(document.body);
reset();
</script></body></html>
