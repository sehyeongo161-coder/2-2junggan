const QUESTIONS=[
{id:'heechim-scalp-01',kind:'core',cat:'운동구 주변',a:'운동구',q:'전후정중선 중점의 후방 0.5cm인 상점과, 미후두선(미침선)·구렛나루 앞 경계의 교차점인 하점을 연결한 선.',d:['감각구','무도진전제어구','혈관운동구(혈관서축구)'],e:'상점은 전후정중선의 중점보다 뒤로 0.5cm, 하점은 미침선과 구렛나루 앞 경계의 교차점입니다.',p:9},
{id:'heechim-scalp-02',kind:'core',cat:'운동구 주변',a:'감각구',q:'운동구에서 후방으로 1.5cm 평행이동한 선.',d:['운동구','무도진전제어구','혈관운동구(혈관서축구)'],e:'운동구의 뒤쪽 1.5cm는 감각구입니다. 앞쪽 1.5cm는 무도진전제어구입니다.',p:10},
{id:'heechim-scalp-03',kind:'core',cat:'운동구 주변',a:'무도진전제어구',q:'운동구에서 전방으로 1.5cm 평행이동한 선.',d:['감각구','운동구','혈관운동구(혈관서축구)'],e:'운동구 앞쪽 1.5cm가 무도진전제어구이며, 여기서 다시 앞쪽 1.5cm가 혈관운동구입니다.',p:10},
{id:'heechim-scalp-04',kind:'core',cat:'운동구 주변',a:'혈관운동구(혈관서축구)',q:'무도진전제어구에서 전방으로 1.5cm 평행이동한 선.',d:['운동구','감각구','무도진전제어구'],e:'앞에서 뒤로 혈관운동구 → 무도진전제어구 → 운동구 → 감각구입니다. 이웃한 자극구 사이 간격은 각각 1.5cm입니다.',p:11},
{id:'heechim-scalp-05',kind:'core',cat:'귀·두정결절 주변',a:'훈청구',q:'이첨 직상 1.5cm에서 앞뒤로 각각 2cm씩 수평으로 그은 총 4cm의 선.',d:['언어3구','언어2구','실행구'],e:'귀의 위쪽 끝인 이첨에서 1.5cm 올라간 지점이 중점이며, 앞 2cm + 뒤 2cm입니다.',p:11},
{id:'heechim-scalp-06',kind:'core',cat:'귀·두정결절 주변',a:'언어3구',q:'훈청구의 중점에서 후방 4cm 지점으로 이동한 뒤, 그곳에서 전방으로 4cm 그은 수평선.',d:['훈청구','언어2구','실행구'],e:'같은 선분을 훈청구 중점에서 뒤로 4cm라고 표현할 수 있습니다. 훈청구 뒤쪽 절반 2cm에 뒤로 2cm를 더 연장한 범위입니다.',p:12},
{id:'heechim-scalp-07',kind:'core',cat:'귀·두정결절 주변',a:'언어2구',q:'두정결절 후하방 2cm 되는 곳에서 전후정중선과 평행하게 그은 3cm의 직선.',d:['언어3구','실행구','훈청구'],e:'두정결절의 후하방 2cm가 기준입니다. 두정결절 자체에서 3개의 선을 그으면 실행구입니다.',p:12},
{id:'heechim-scalp-08',kind:'core',cat:'귀·두정결절 주변',a:'실행구',q:'두정결절을 기점으로 아래쪽으로 그은 선과, 그 선의 앞뒤로 각각 40° 벌려 그은 선까지, 각 3cm인 직선 3개.',d:['언어2구','언어3구','견운동감각구'],e:'핵심은 두정결절 자체를 기점으로 하는 3개 선, 각 3cm, 앞뒤 40°입니다.',p:12},
{id:'heechim-scalp-09',kind:'core',cat:'머리 위·뒤쪽',a:'족운동감각구',q:'전후정중선에서 좌우 1cm, 감각구 상점보다 후방 1cm인 지점에서 앞으로 3cm 그은 정중선과 평행한 선.',d:['견운동감각구','시구','평형구'],e:'좌우 위치는 정중선에서 1cm, 앞뒤 위치는 감각구 상점의 뒤 1cm입니다. 그곳에서 앞으로 3cm입니다.',p:13,note:'원자료에 「족보 아님」으로 표시된 항목입니다.'},
{id:'heechim-scalp-10',kind:'core',cat:'머리 위·뒤쪽',a:'견운동감각구',q:'족운동감각구보다 바깥쪽으로 1cm 떨어진 곳에 그은 3cm 길이의 평행선.',d:['족운동감각구','시구','평형구'],e:'족운동감각구에서 바깥쪽으로 1cm 더 이동합니다. 선의 길이는 같은 3cm입니다.',p:13,note:'원자료에 「족보 아님」으로 표시된 항목입니다.'},
{id:'heechim-scalp-11',kind:'core',cat:'머리 위·뒤쪽',a:'시구',q:'외후두융기 좌우 1cm에서 위로 4cm 그은 정중선과 평행한 선.',d:['평형구','족운동감각구','견운동감각구'],e:'시구는 좌우 1cm·위로 4cm, 평형구는 좌우 3.5cm·아래로 4cm입니다.',p:13},
{id:'heechim-scalp-12',kind:'core',cat:'머리 위·뒤쪽',a:'평형구',q:'외후두융기 좌우 3.5cm에서 아래로 4cm 그은 정중선과 평행한 선.',d:['시구','족운동감각구','견운동감각구'],e:'평형구는 시구보다 바깥쪽에 위치하며, 외후두융기 높이에서 아래로 내려갑니다.',p:13},
{id:'heechim-scalp-13',kind:'core',cat:'이마의 내장구',a:'위구',q:'동공에서 수직으로 올라간 선 위에서, 전발제를 기점으로 위로 2cm 그은 정중선과 평행한 직선.',d:['간담구','흉강구','생식구'],e:'동공 수직선에서 전발제 위쪽 2cm는 위구, 아래쪽 2cm는 간담구입니다.',p:14},
{id:'heechim-scalp-14',kind:'core',cat:'이마의 내장구',a:'간담구',q:'위구와 같은 수직선 위에서, 전발제를 기점으로 아래로 2cm 그은 직선.',d:['위구','장구','흉강구'],e:'위구의 아래쪽 연장선입니다. 전발제를 기준으로 위는 위구, 아래는 간담구입니다.',p:14},
{id:'heechim-scalp-15',kind:'core',cat:'이마의 내장구',a:'흉강구',q:'전후정중선과 위구 사이의 중간에서, 전발제를 기준으로 위아래 각각 2cm씩 그은 총 4cm의 직선.',d:['위구','생식구','간담구'],e:'정중선과 위구 사이 중간에 위치하며, 전발제 위아래에 모두 걸치는 총 4cm 선입니다.',p:14},
{id:'heechim-scalp-16',kind:'core',cat:'이마의 내장구',a:'생식구',q:'위구에서 바깥쪽으로 위구–흉강구 사이 거리만큼 떨어진 곳에서, 전발제를 기점으로 위로 2cm 그은 직선.',d:['장구','위구','흉강구'],e:'안쪽부터 정중선 → 흉강구 → 위구·간담구 → 생식구·장구입니다. 바깥 열에서 위쪽이 생식구입니다.',p:14},
{id:'heechim-scalp-17',kind:'core',cat:'이마의 내장구',a:'장구',q:'생식구와 같은 수직선 위에서, 전발제를 기점으로 아래로 2cm 그은 직선.',d:['생식구','간담구','흉강구'],e:'바깥 열에서 전발제 위쪽 2cm는 생식구, 아래쪽 2cm는 장구입니다.',p:14},
{id:'heechim-scalp-18',kind:'parts',cat:'운동구 세부 구간',a:'상운동구',q:'운동구를 5등분했을 때 상부 1/5에 해당하는 구간.',d:['중운동구','하운동구','하지감각구'],e:'운동구의 상부 1/5는 상운동구, 중간 2/5는 중운동구, 하부 2/5는 하운동구입니다.',p:9},
{id:'heechim-scalp-19',kind:'parts',cat:'운동구 세부 구간',a:'중운동구',q:'운동구를 5등분했을 때 중간 2/5에 해당하는 구간.',d:['상운동구','하운동구','상지감각구'],e:'중간 2/5는 중운동구입니다. 상부 1/5·중간 2/5·하부 2/5로 나눕니다.',p:9},
{id:'heechim-scalp-20',kind:'parts',cat:'운동구 세부 구간',a:'하운동구',q:'운동구를 5등분했을 때 하부 2/5에 해당하는 구간.',d:['상운동구','중운동구','안면감각구'],e:'운동구의 아래쪽 2/5는 하운동구입니다. 감각구의 같은 높이 구간은 안면감각구입니다.',p:9},
{id:'heechim-scalp-21',kind:'parts',cat:'감각구 세부 구간',a:'하지감각구',q:'감각구를 5등분했을 때 상부 1/5에 해당하는 구간.',d:['상지감각구','안면감각구','상운동구'],e:'감각구의 상부 1/5는 하지, 중간 2/5는 상지, 하부 2/5는 안면감각구입니다.',p:10},
{id:'heechim-scalp-22',kind:'parts',cat:'감각구 세부 구간',a:'상지감각구',q:'감각구를 5등분했을 때 중간 2/5에 해당하는 구간.',d:['하지감각구','안면감각구','중운동구'],e:'감각구 중간 2/5는 상지감각구입니다. 운동구의 같은 높이 구간은 중운동구입니다.',p:10},
{id:'heechim-scalp-23',kind:'parts',cat:'감각구 세부 구간',a:'안면감각구',q:'감각구를 5등분했을 때 하부 2/5에 해당하는 구간.',d:['하지감각구','상지감각구','하운동구'],e:'감각구 아래쪽 2/5는 안면감각구입니다. 운동구의 같은 높이 구간은 하운동구입니다.',p:10}
];

const pool=scope=>QUESTIONS.filter(q=>scope==='all'||q.kind===scope).map(q=>q.id);
function fresh(scope='all',order='random'){const ids=pool(scope);return {v:1,scope,order,queue:order==='random'?shuffle(ids):ids,retry:[],passed:[],round:0,attempts:0,correct:0,options:[],selected:null,graded:false,lastAnswerPositions:{}};}
function valid(s){return s&&s.v===1&&['all','core','parts'].includes(s.scope)&&['random','ordered'].includes(s.order)&&['queue','retry','passed','options'].every(k=>Array.isArray(s[k]))&&['queue','retry','passed'].every(k=>new Set(s[k]).size===s[k].length&&s[k].every(id=>pool(s.scope).includes(id)))&&Number.isInteger(s.round)&&Number.isInteger(s.attempts)&&Number.isInteger(s.correct);}
let state;try{state=JSON.parse(storage.getItem(key))}catch{}
if(!valid(state))state=fresh();
if(!state.lastAnswerPositions||typeof state.lastAnswerPositions!=='object'||Array.isArray(state.lastAnswerPositions))state.lastAnswerPositions={};
let view='quiz',showAnswers=true;
function save(){try{storage.setItem(key,JSON.stringify(state))}catch{$('storage-note').textContent='기록을 저장하지 못했습니다. 현재 화면에서는 계속 풀 수 있습니다.'}}
function send(type,data={}){if(parent!==window)parent.postMessage({type:'heechim-'+type,...data},location.origin)}
function resize(){send('size',{height:document.body.scrollHeight})}
function focusQuestion(){requestAnimationFrame(()=>{if(parent!==window)send('focus-question',{top:$('study').offsetTop});else $('study').scrollIntoView({block:'start',behavior:'smooth'});$('question').focus({preventScroll:true})})}
function current(){return byId.get(state.queue[0])}
function pick(value){if(state.graded||!current())return;state.selected=value;save();render()}
function render(){
 $('scope').value=state.scope;$('order').value=state.order;$('quiz-view').hidden=view!=='quiz';$('list-view').hidden=view!=='list';
 $('quiz-tab').setAttribute('aria-pressed',String(view==='quiz'));$('list-tab').setAttribute('aria-pressed',String(view==='list'));
 if(view==='list'){renderList();resize();return;}
 const q=current(),total=pool(state.scope).length;
 $('study').hidden=!q;$('finished').hidden=!!q;
 $('phase').textContent=!q?'세트 완료':state.round===0?'1차 전체 출제':'오답 복습 '+state.round+'회차';
 $('score').textContent='통과 '+state.passed.length+'/'+total+' · 정답 '+state.correct+' / 풀이 '+state.attempts;
 $('bar').style.width=state.passed.length/total*100+'%';
 if(!q){$('finished-summary').textContent=total+'문항을 모두 맞혔습니다. 총 '+state.attempts+'회 풀이 · 오답 '+(state.attempts-state.correct)+'회';save();resize();return;}
 const expected=[q.a,...q.d];
 if(state.options.length!==4||new Set(state.options).size!==4||!state.options.every(x=>expected.includes(x))){
  const choices=shuffle(expected),previous=state.lastAnswerPositions[q.id];
  if(Number.isInteger(previous)&&previous>=0&&previous<choices.length&&choices.indexOf(q.a)===previous){
   const alternative=shuffle(choices.map((_,i)=>i).filter(i=>i!==previous))[0];
   [choices[previous],choices[alternative]]=[choices[alternative],choices[previous]];
  }
  state.options=choices;
  state.lastAnswerPositions[q.id]=choices.indexOf(q.a);
  state.selected=null;state.graded=false;
 }
 $('category').textContent=q.cat;$('position').textContent=state.round===0?(total-state.queue.length+1)+' / '+total:'남은 '+state.queue.length+'문항';
 $('question').textContent=q.q;$('options').replaceChildren();
 state.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('aria-pressed',String(state.selected===opt));b.disabled=state.graded;const n=document.createElement('span');n.className='num';n.textContent=i+1;b.append(n,document.createTextNode(opt));if(state.graded&&opt===q.a)b.classList.add('correct');if(state.graded&&opt===state.selected&&opt!==q.a)b.classList.add('wrong');b.onclick=()=>pick(opt);$('options').append(b)});
 $('grade-actions').hidden=state.graded;$('grade').disabled=state.selected===null;$('feedback').hidden=!state.graded;
 if(state.graded){const ok=state.selected===q.a;const mark=document.createElement('b');mark.textContent=ok?'O':'X';$('verdict').className='verdict '+(ok?'good':'bad');$('verdict').replaceChildren(mark,document.createTextNode(ok?'정답입니다':'오답입니다'));$('answer').textContent='정답: '+q.a;$('explanation').textContent=q.e;$('source').textContent=SOURCE+' · PDF '+q.p+'쪽';$('q-note').hidden=!q.note;$('q-note').textContent=q.note||'';$('next').textContent=state.queue.length===1?(state.retry.length?'오답 복습 시작 →':'세트 결과 보기 →'):'다음 문제 →';}
 save();resize();
}
function grade(){const q=current();if(!q||state.graded||state.selected===null)return;const correct=state.selected===q.a;state.graded=true;state.attempts++;if(correct){state.correct++;if(!state.passed.includes(q.id))state.passed.push(q.id)}else if(!state.retry.includes(q.id))state.retry.push(q.id);save();host?.__QUIZ_TRACK_ATTEMPT?.({key:q.id,label:q.q,group:'희침 · 두침요법',correct,revealed:false});render();requestAnimationFrame(()=>{if(parent!==window)send('focus-grade',{top:$('feedback').offsetTop,explanationTop:$('explanation').offsetTop});else $('feedback').scrollIntoView({block:'center',behavior:'smooth'});$('next').focus({preventScroll:true})});}
function next(){if(!state.graded)return;state.queue.shift();state.graded=false;state.selected=null;state.options=[];if(!state.queue.length&&state.retry.length){state.queue=state.order==='random'?shuffle(state.retry):[...state.retry];state.retry=[];state.round++;}save();render();if(current())focusQuestion();}
function restart(scope=state.scope,order=state.order){const lastPositions=state.lastAnswerPositions||{};state=fresh(scope,order);state.lastAnswerPositions=lastPositions;save();render();if(view==='quiz')focusQuestion();}
function renderList(){const qs=pool(state.scope).map(id=>byId.get(id));$('list-count').textContent='위치 ↔ 명칭 목록 · '+qs.length+'개';$('toggle-answers').textContent=showAnswers?'정답 가리기':'정답 모두 보기';$('list-items').replaceChildren();qs.forEach((q,i)=>{const item=document.createElement('article');item.className='card list-item';const h=document.createElement('h3');h.textContent=(i+1)+'. '+(showAnswers?q.a:q.cat);const p=document.createElement('p');p.className='list-location';p.textContent=q.q;const d=document.createElement('details');d.open=showAnswers;const s=document.createElement('summary');s.textContent='정답·해설';const a=document.createElement('p');a.className='list-answer';a.textContent=q.a+' — '+q.e;const src=document.createElement('p');src.className='source';src.textContent='won 정리본 · PDF '+q.p+'쪽';d.append(s,a,src);item.append(h,p,d);if(q.note){const n=document.createElement('p');n.className='warning';n.textContent=q.note;item.append(n)}$('list-items').append(item)});}
function switchView(v){view=v;render();}
function onKey(e){if(e.repeat||e.isComposing||view!=='quiz'||!current()||['SELECT','INPUT','TEXTAREA'].includes(e.target?.tagName))return;if(['1','2','3','4'].includes(e.key)&&!state.graded){e.preventDefault();pick(state.options[Number(e.key)-1]);}else if(e.key==='Enter'){if(e.target?.closest?.('#quiz-tab,#list-tab,#reset,#again'))return;e.preventDefault();state.graded?next():grade();}}
document.addEventListener('keydown',onKey);
$('grade').onclick=grade;$('next').onclick=next;$('reset').onclick=()=>restart();$('again').onclick=()=>restart();$('scope').onchange=e=>restart(e.target.value);$('order').onchange=e=>restart(state.scope,e.target.value);$('quiz-tab').onclick=()=>switchView('quiz');$('list-tab').onclick=()=>switchView('list');$('toggle-answers').onclick=()=>{showAnswers=!showAnswers;render()};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='heechim-open-question'&&byId.has(e.data.id)){const lastPositions=state.lastAnswerPositions||{};state=fresh('all','ordered');state.lastAnswerPositions=lastPositions;state.queue=[e.data.id,...state.queue.filter(id=>id!==e.data.id)];view='quiz';save();render();focusQuestion();}if(e.data?.type==='heechim-key')onKey({key:e.data.key,target:null,preventDefault(){}});});
$('storage-note').textContent=host?'학습 진행과 오답 기록은 로그인한 계정에 저장됩니다.':'학습 진행은 이 브라우저에 저장됩니다.';
new ResizeObserver(resize).observe(document.body);render();
</script></body></html>
