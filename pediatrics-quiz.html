<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>소아과학 족보 퀴즈</title><style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#293347;background:#fffdf4;--accent:#946500;--light:#fff2bc;--muted:#7b704b;--line:#e8dba9}
*{box-sizing:border-box}body{margin:0;padding:12px 0 55px;line-height:1.67}button,input,textarea{font:inherit}button{min-height:42px;padding:10px 17px;border-radius:10px;border:1px solid #e8dba9;background:#fff;cursor:pointer;color:#293347}button:hover{background:var(--light)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b88400;outline-offset:2px}button:disabled{opacity:.46;cursor:default}button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:750}button.primary:hover{filter:brightness(1.06)}[hidden]{display:none!important}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}h1{font-size:26px;letter-spacing:-.035em;line-height:1.4;margin:0}.eyebrow{color:#7b704b;font-size:13px;margin:0 0 4px}.summary{display:flex;flex-wrap:wrap;gap:7px}.summary span{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;font-size:14px;white-space:nowrap}.summary b{color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.help{color:var(--muted);font-size:13px}.round{height:44px;width:44px;border-radius:50%;padding:0;font-size:26px;line-height:1}.card{background:#fff;border:1px solid #e8dba9;border-radius:17px;padding:25px 27px;box-shadow:0 5px 22px #8b650007}.track{height:6px;background:#fff2bc;border-radius:9px;overflow:hidden;margin-bottom:20px}.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:#7b704b;font-size:13px}.pill{border-radius:7px;padding:3px 9px;background:var(--light);color:#946500;font-weight:750}.card h2{font-size:23px;line-height:1.65;letter-spacing:-.035em;margin:16px 0 19px;white-space:pre-wrap;word-break:keep-all}.options{display:grid;gap:9px}.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 15px;line-height:1.5;border-color:#e8dba9}.opt .num{font-weight:800;color:#946500;min-width:25px}.opt.selected{border-color:var(--accent);background:var(--light);box-shadow:inset 0 0 0 1px var(--accent)}.opt.right{border-color:#73ac85;background:#f0f8f1}.opt.wrong{border-color:#db979b;background:#fff1f1}.answer-fields{display:grid;gap:12px}.input-row label{display:block;color:#675e42;font-size:13px;font-weight:700;margin-bottom:5px}.answer-fields input,.answer-fields textarea{display:block;width:100%;padding:12px 14px;border:1px solid #e8dba9;background:#fff;border-radius:9px;font-size:17px;color:#293347}.answer-fields textarea{resize:vertical;min-height:90px}.actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:9px}.feedback{margin-top:20px;padding:17px 19px;border-radius:11px;border:1px solid var(--line);background:#fffaf0}.feedback h3{margin:0 0 8px;font-size:18px}.feedback p{margin:7px 0;white-space:pre-wrap}.feedback .yes{color:#246c43}.feedback .no{color:#b04451}.caution{background:#fff8ed;border:1px solid #f1d6ad;color:#8c5b24;border-radius:9px;padding:12px 14px;font-size:13px;margin:20px 0 20px}.finish{text-align:center;padding:30px 18px}.finish h2{margin:4px 0 12px}.source{margin:18px 0 0;color:#7b704b;font-size:12px}.manual-buttons{display:flex;flex-wrap:wrap;gap:8px}.manual-buttons button{flex:1}.image-note{font-size:13px;background:#fffaf0;padding:12px 14px;border-radius:9px;color:#675e42;margin:12px 0}#error{color:#b33e4d}
.card .meta + .options{margin-top:20px}
.card .meta + .answer-groups{margin-top:20px}
.answer-groups{gap:20px}
.answer-group{min-width:0;margin:0;padding:14px 16px 16px;border:1px solid var(--line);border-radius:12px}
.answer-group legend{padding:0 6px;color:var(--accent);font-size:16px;font-weight:750}
.answer-group-fields{display:grid;grid-template-columns:repeat(var(--field-count),minmax(0,1fr));gap:12px}
@media(max-width:600px){.answer-group-fields{grid-template-columns:1fr}.answer-group{padding:12px}}
.figure-block{margin:15px 0 18px;background:#fff;border:1px solid #e8dba9;border-radius:12px;padding:14px 13px 11px}
.figure-block svg{display:block;width:100%;max-width:760px;height:auto;margin:0 auto;background:#fff}
.figure-block figcaption{text-align:center;color:#7b704b;font-size:12px;line-height:1.55;margin-top:8px}
.figure-block img{max-width:100%}
.figure-block{min-width:0;max-width:800px;margin-left:auto;margin-right:auto}
.figure-viewport{overflow:visible;overscroll-behavior:auto;border-radius:6px;touch-action:auto}
.figure-viewport:focus-visible{outline:3px solid #b88400;outline-offset:2px}
.figure-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:12px}
.figure-tools button{flex:none;min-height:40px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--accent)}
.figure-viewport.is-zoomed{overflow:auto;overscroll-behavior:auto;touch-action:pan-x pan-y;max-height:720px;border:1px solid var(--line)}
.figure-viewport.is-zoomed svg{width:1520px;max-width:none;margin:0}
@media(max-width:600px){.figure-block{padding:10px 5px}.figure-tools{padding:0 3px;gap:6px}.figure-tools span{max-width:160px}.figure-viewport.is-zoomed{max-height:520px}}
@media(max-width:600px){body{padding-top:4px}h1{font-size:23px}.card{padding:21px 17px;border-radius:13px}.card h2{font-size:20px}.opt{padding:12px}.summary span{font-size:13px;padding:6px 9px}.actions button{flex:1}.card .actions{gap:8px}}

/* 부인과학: 퀴즈 / 전체 족보 목록 */
.view-switch{display:inline-flex;align-items:center;gap:3px;margin:2px 0 17px;padding:4px;background:#fff2bc;border-radius:12px}
.view-switch button{border:0;border-radius:9px;background:transparent;color:#7b704b;font-size:15px;font-weight:700;min-height:40px;padding:9px 23px}
.view-switch button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 6px #8b650012}
.list-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.list-top h2{font-size:19px;margin:0;letter-spacing:-.025em}
.list-top p{margin:0;color:var(--muted);font-size:13px}
.list-answer-toggle{border:1px solid #e8dba9;color:var(--accent);background:#fff;font-weight:700;font-size:13px;min-height:39px;padding:7px 14px}
.past-paper-items{display:grid;gap:11px}
.paper-item{background:#fff;border:1px solid #e8dba9;border-radius:13px;padding:17px 19px;box-shadow:0 4px 12px #8b650005}
.paper-item.is-correct{border-color:#c4dbc9}
.paper-item.is-wrong{border-color:#eed3d4}
.paper-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.paper-labels{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:#7b704b}
.paper-number{font-weight:800;color:var(--accent);font-size:14px}
.paper-status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;background:#fffaf0;color:#675e42;white-space:nowrap}
.paper-status.correct{color:#286d46;background:#eaf6ed}
.paper-status.wrong{color:#a34c4e;background:#fff0f0}
.paper-status.revealed{color:#8c6240;background:#fff6e7}
.paper-prompt{font-size:16px;font-weight:650;line-height:1.75;white-space:pre-wrap;word-break:keep-all;margin:11px 0 4px;overflow-wrap:anywhere}
.paper-choice-list{margin:10px 0 1px;padding:0;list-style:none;color:#536075;font-size:14px;display:grid;gap:6px}
.paper-choice-list li{padding-left:2px;line-height:1.65;word-break:keep-all}
.paper-detail{margin-top:10px;color:#7b704b;font-size:13px}
.paper-detail summary{cursor:pointer;font-weight:650;color:#946500;width:fit-content}
.paper-detail .figure-block{max-width:800px;margin:14px auto}
.paper-answer{margin:12px 0 1px;padding:11px 13px;border:1px solid #dfe9e1;background:#f6faf7;color:#28583d;border-radius:9px;white-space:pre-wrap;word-break:keep-all;font-size:14px}
.paper-answer p{margin:5px 0}
.paper-answer .paper-note{color:#6b7780}
.paper-restoration{display:inline-block;margin-top:7px;font-size:12px;color:#986b36}
@media(max-width:600px){.view-switch{display:flex;width:100%}.view-switch button{flex:1}.paper-item{padding:15px 13px}.paper-prompt{font-size:15px}.list-top{align-items:flex-start}.paper-choice-list{font-size:13px}}

/* 족보 목록 정답·해설: 기출 원문과 근거, 객관식 선지별 이유 구분 */
.paper-answer{background:#fffaf0;border-color:#e8dba9;color:#26374b;padding:13px 15px}
.paper-answer-key{color:#255c40;font-size:15px;font-weight:650}
.paper-explanation{margin-top:12px;border-top:1px solid #e8dba9;padding-top:11px;line-height:1.8;color:#3c495b;font-size:14px}
.paper-explanation>strong{font-size:13px;color:#946500}
.paper-explanation p{margin:6px 0 1px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.paper-note{margin-top:10px!important;color:#7b704b!important;font-size:12px;line-height:1.75}
.paper-choice{padding:5px 0;border-bottom:1px solid #f4ecd4}
.paper-choice:last-child{border:0}
.choice-reason{font-size:13px;line-height:1.7;margin:5px 0 0 25px;word-break:keep-all}
.choice-reason.no{color:#b54b55}
.choice-reason.yes{color:#27734b}
.choice-reason b{display:inline-block;min-width:12px}
@media(max-width:600px){.paper-explanation{font-size:13px}.choice-reason{margin-left:18px}}

/* 원본 부인과 족보: 절별 랜덤 학습 */
.section-selector{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:1px 0 17px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.section-heading strong{color:#675e42;font-size:14px}.section-subtitle{font-size:12px;color:var(--muted)}
.section-buttons{display:flex;flex-wrap:wrap;gap:7px}
.section-buttons button{border:1px solid #e8dba9;min-height:38px;border-radius:9px;padding:7px 14px;font-size:14px;font-weight:680;white-space:nowrap;color:#7b704b}
.section-buttons button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-buttons button small{font-size:11px;opacity:.8;margin-left:3px}
.section-name{margin:10px 0 0;color:#7b704b;font-size:13px}
@media(max-width:600px){.section-selector{padding:12px}.section-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.section-buttons button{min-height:41px;padding:7px 3px;font-size:13px}.section-buttons button small{display:block;font-size:10px;margin:0}}
.variant-picker{margin:0 0 17px;padding:13px 14px;border:1px solid #e8dba9;background:#fff;border-radius:12px}
.variant-picker strong{display:block;font-size:14px;margin-bottom:8px;color:#675e42}
.variant-options{display:flex;gap:7px;flex-wrap:wrap}
.variant-options button{font-size:14px;font-weight:650;min-height:38px;border-radius:9px;padding:7px 14px;border:1px solid #e8dba9;background:#fff;color:#7b704b}
.variant-options button[aria-pressed="true"]{border-color:var(--accent);background:var(--light);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.variant-note{font-size:12px;color:var(--muted);margin:8px 0 0}.paper-variant{background:#fff4ea;color:#98613b;border-radius:6px;font-weight:750;padding:3px 7px}
@media(max-width:600px){.variant-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.variant-options button{padding:8px 3px;font-size:12px}}

/* 세트: 1차 전 문항 → 오답만 재출제 → 모두 정답이면 완료 */
.retry-stage{margin:0 0 14px;padding:12px 14px;border-radius:11px;background:#fff8ed;border:1px solid #f0d7b8;color:#8e5c32;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.retry-stage strong{color:#946500}
.grade-feedback{margin:15px 0 12px;border-width:2px;scroll-margin-top:18px}
.grade-feedback.correct{border-color:#78b68e;background:#f4fbf5}
.grade-feedback.incorrect{border-color:#d99aa3;background:#fff6f6}
.grade-head{display:flex;align-items:flex-start;gap:14px}
.grade-mark{display:grid;place-items:center;flex:none;border-radius:50%;width:72px;height:72px;font-size:46px;font-weight:850;line-height:1;border:4px solid currentColor}
.grade-feedback.correct .grade-mark,.grade-feedback.correct .grade-title{color:#23834b}
.grade-feedback.incorrect .grade-mark,.grade-feedback.incorrect .grade-title{color:#c34356}
.grade-title{font-size:22px;font-weight:800;margin:0 0 4px}
.grade-question{font-size:14px;font-weight:650;line-height:1.6;color:#3e4c5c;margin:0!important;word-break:keep-all}
.grade-body{margin-top:13px;padding-top:11px;border-top:1px solid #e8dba9;font-size:14px}
.grade-body p{line-height:1.75}
.card.grade-checked>.actions{margin-top:12px}
@media(max-width:600px){.grade-head{gap:10px}.grade-mark{width:56px;height:56px;font-size:37px;border-width:3px}.grade-title{font-size:19px}.grade-question{font-size:13px}}

.category-picker{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.category-picker select{font:inherit;max-width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#293347}
.answer-key{font-size:16px;color:#255c40}.grade-body .paper-note{font-size:12px;color:#7b704b}.paper-answer .grade-body{margin:0;padding:0;border:0}
@media(max-width:600px){.section-buttons{grid-template-columns:repeat(3,minmax(0,1fr))}.category-picker select{width:100%}}

/* 소아과 노란색 테마 */
button.primary,.section-buttons button[aria-pressed="true"]{background:#f2c744;border-color:#d9ad25;color:#493600}
.track i{background:#d7aa22}
.view-switch button[aria-selected="true"]{background:#fff6d6}

.bank-switch{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:12px;background:#fff2bc;margin:0 0 16px}
.bank-switch button{flex:1;border:0;background:transparent;color:#7b704b;font-weight:750}
.bank-switch button[aria-selected="true"]{background:#f2c744;color:#493600;box-shadow:0 1px 5px #8b650012}
.memory-note{margin:0 0 16px;padding:12px 15px;background:#fff8dc;border:1px solid var(--line);border-radius:10px;font-size:13px;color:#675e42}
</style></head>
<body>
<div class="header"><div><p id="study-eyebrow" class="eyebrow">본과 2학년 2학기 · 16~22학번 족보</p><h1 id="study-title">소아과학 족보 퀴즈</h1></div><div id="summary" class="summary"></div></div>
<p id="error" role="status" hidden></p><div id="study" hidden>
<div class="bank-switch" role="tablist" aria-label="소아과 학습 유형"><button type="button" id="bank-past" data-bank="past" role="tab" aria-selected="true" aria-controls="learning-content">족보 문제</button><button type="button" id="bank-memory" data-bank="memory" role="tab" aria-selected="false" aria-controls="learning-content" tabindex="-1">답치기 암기</button></div>
<div id="learning-content" role="tabpanel" aria-labelledby="bank-past">
<p id="memory-note" class="memory-note" hidden>21·22학번 Word 족보의 19개 범주와 순서에 맞춘 핵심 연결·숫자 연습입니다. 정답을 하나 고르고 채점하세요. 모든 문제를 한 번 푼 뒤 오답만 반복합니다.</p>
<div class="section-selector" aria-label="소아과학 출제 범위"><div class="section-heading"><strong id="section-title">출제 범위</strong><span id="section-subtitle" class="section-subtitle">선택한 범위 안에서 랜덤 출제</span></div>
<div id="section-buttons" class="section-buttons" role="group" aria-label="출제 범위 선택"><button type="button" data-scope="all" aria-pressed="true">이번 시험범위 <small></small></button><button type="button" data-scope="1" aria-pressed="false">제1장 <small></small></button><button type="button" data-scope="2" aria-pressed="false">제2장 <small></small></button><button type="button" data-scope="3" aria-pressed="false">제3장 <small></small></button><button type="button" data-scope="appendix" aria-pressed="false">범위 밖 부록 <small></small></button><button type="button" data-scope="everything" aria-pressed="false">전체 족보 <small></small></button></div>
<label class="category-picker">범주 선택 <select id="category-filter" aria-label="세부 범주 선택"></select></label><p id="section-name" class="section-name"></p></div>
<div class="view-switch" role="tablist" aria-label="학습 방식"><button id="view-quiz" role="tab" aria-selected="true" aria-controls="quiz-view">퀴즈</button><button id="view-list" role="tab" aria-selected="false" aria-controls="list-view" tabindex="-1">전체 족보 목록</button></div>
<section id="quiz-view" role="tabpanel" aria-labelledby="view-quiz"><div class="toolbar"><span id="quiz-scope-help" class="help"></span><button id="reset" class="round" title="선택 범위 처음부터 다시 풀기" aria-label="선택 범위 처음부터 다시 풀기">↻</button></div><div id="stage" class="card"></div></section>
<section id="list-view" role="tabpanel" aria-labelledby="view-list" hidden><div class="list-top"><div><h2 id="list-heading"></h2><p id="list-count"></p></div><button id="list-toggle-answers" class="list-answer-toggle" aria-pressed="true">정답·해설 가리기</button></div><div id="list-items" class="past-paper-items"></div></section>
<p id="source-note" class="source">이번 시험범위 86항목 · 범위 밖 부록 64항목. 주형 해설집·통합족보·학번별 복기·수업자료의 답과 간단 해설을 수록했습니다. 선지·그림이 불완전한 항목은 자료 확인으로 표시합니다.</p>
</div></div><script src="./pediatrics-quiz.js?v=20261022-pediatrics-2122-sync-v4"></script></body></html>
