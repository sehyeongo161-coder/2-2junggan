 0 설정 → 전극 연결 → 전원 ON → 서서히 출력 증가"],"source_block_raw":"21학번 중간 4번 / 22학번 중간 8번\n전침에 대한 설명으로 옳지 않은 것은?\n① 전침기 on 한 후 치료를 시작한다. (?)\n② ?\n③ 먼 거리에 있는 경혈을 선정하고 침병에 연결한다.(21학번) (X)\n혈위 멀리해서 전침을 건다.(22학번) (X)\n(→ 자극하려는 부위 주변에 인접한 혈위를 함께 배치한다.)\n④ ?\n⑤ ?\n\n(2) 전침조작\n① 호침의 자침법에 따라 혈위에 자입하고 필요한 감응에 도달케 함\n② 출력 volume을 ‘0’에 맞추고 전침기 출력 cord를 각각 자입된 2개의 침체에 연결\n③ 전원스위치를 넣고(on), 점차 출력 전류량을 높여 필요한 정도에 이르게 함\n④ 치료가 끝나면 출력 volume을 ‘0’으로 돌린 다음 스위치를 끄고(off) cord를 뺌\n⑤ 가볍게 수회 捻鍼하고 拔鍼\n(출력 0 설정 → 전극 연결 → 전원 ON → 서서히 출력 증가)\n\n(두 개의 연결 단자를 걸 혈위를 정해야 함. 혈 사이가 너무 멀면 자극의 의미가 없음.\n자극하려는 부위 주변에 인접한 혈위를 함께 배치하여 해당 부위에 자극을 집중시키는 방법이 효율적.)\n\f2. 온냉경락요법\n가. 경피경근온열요법","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-007","page":3,"section":"2. 온냉경락요법 / 경피경근온열요법","source_labels":["21학번 중간 7번","22학번 중간 번호 미복기 07"],"prompt":"경피경근온열요법 문제, 옳지 않은 것 고르기","original_question_type":"객관식 일부 복기","choices":[{"label":null,"text":"급성 염증에 사용한다."}],"recorded_answer":{"value":"복기 문장 X","status":"첨부본 답 기록","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":["나머지 선택지는 없음. 금기 관련 문장은 앞선 대화상 써머리 내용으로 구분되므로 수업자료 원문에 직접 있는 문장이라고 표시하지 않음."],"statement_judgments":[{"text":"급성 염증에 사용한다.","recorded_judgment":"X"}],"explanation_excerpts":["요통, 경견통 등의 근골격계 통증, 관절 구축, 만성 관절염, 경직 및 한증(寒症)양상의 제반 증후","24시간 이내의 초기 손상 및 병변에는 사용하지 않는다. 외상 초기, 급성 염증기, 만성염증의 과도한 활성시기에 나타나는 초기 열성 증상이 소멸되기 전에는 사용하지 않는다."],"source_block_raw":"21학번 중간 7번 / 22학번 중간 번호 미복기 07\n경피경근온열요법 문제, 옳지 않은 것 고르기\n급성 염증에 사용한다. (X)\n(→ 요통, 경견통 등의 근골격계 통증, 관절 구축, 만성 관절염, 경직 및 한증(寒症)양상의 제반 증후)\n\n24시간 이내의 초기 손상 및 병변에는 사용하지 않는다. 외상 초기, 급성 염증기,\n만성염증의 과도한 활성시기에 나타나는 초기 열성 증상이 소멸되기 전에는 사용하지 않는다.","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-008","page":3,"section":"2. 온냉경락요법 / 경피경근온열요법","source_labels":["22학번 중간 1번"] "text":"피부 과민자"}],"recorded_answer":{"value":"① 극심한 통증의 암환자","status":"첨부본 답 기록","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":["①의 붉은색 답 표시를 확인함. 앞선 대화에서 원본에는 정답과 기타 선지만 있으며 ①~④ 번호는 없었다고 지적됨. 번호는 첨부 정리본 기준."],"explanation_excerpts":["말초신경인성 및 근골격계 급만성통증, 수술 후 통증, 암성통증, 관절염, 대상포진 등"],"source_block_raw":"21학번 기말 2번\nTENS를 적용 가능한 환자는?\n① 극심한 통증의 암환자\n② 중풍 환자\n③ 임산부\n④ 피부 과민자\n\n(3) TENS의 적응증\n말초신경인성 및 근골격계 급만성통증, 수술 후 통증, 암성통증, 관절염, 대상포진 등\n\f나. 기능적 전기자극요법 FES","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-015","page":5,"section":"4. 전기자극요법 / 기능적 전기자극요법 FES","source_labels":["22학번 중간 12번"],"prompt":"FES에 대한 설명으로 옳지 않은 것은?","original_question_type":"지문만 복기/선택지 미복기","choices":[],"recorded_answer":{"value":null,"status":"판단 불가","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":["첨부본에 복기 X라고 표시됨. 아래 FES 설명은 학습용 해설이며 원래 선택지가 아님."],"explanation_excerpts":["하위운동신경은 정상이나 중추신경계나 척수의 이상으로 인해 마비가 나타난 경우에 근육의 수축을 위한 전기자극으로 기능적 동작이 가능하도록 하는 치료법","1~200Hz 주파수 대역 활용 / 일반적으로 15~50Hz 주파수를 활용","전극을 마비된 근육의 motor point에 부착 / 근섬유 주행방향과 평행하게 전극 배치 / 근수축이 발현되도록 강도 높힘 / 근수축 방향으로 기능적인 동작 시행","상위운동신경원 이상에 의한 마비성 증상의 근육 기능 개선 목적 활용 / 척수손상에 따른 족하수, 뇌졸중 환자 편마비 등","심장박동기(pacemaker) 사용 환자, 임신부 하복이하 부위, 안면부위, 경동맥궁 인근, 피부자극 민감자, 감각 손실 부위, 급성 염증 부위 등 사용 금지","과도한 근수축 유발로 인한 통증이 발생되지 않도록 주의"],"source_block_raw":"22학번 중간 12번\nFES에 대한 설명으로 옳지 않은 것은?\n복기 X\n\n2) 기능적 전기자극요법 ( FES : Functional Electrical Stimulation)\n- 하위운동신경은 정상이나 중추신경계나 척수의 이상으로 인해 마비가 나타난 경우에 근육의 수축을\n  위한 전기자극으로 기능적 동작이 가능하도록 하는 치료법\n\n(1) 작용\n① 1~200Hz 주파수 대역 활용\n② 일반적으로 15~50Hz 주파수를 활용하여 상위신경손상으로 인한 마비증상이 있는\n    말초 신경에 전기자극하여 근수축 유발 → 근력 강화, 관절 가동범위 증가, 근육기능 회복\n\n(2) 조작방법\n① 전극을 마비된 근육의 motor point에 부착\n② 근섬유 주행방향과 평행하게 전극 배치\n③ 근수축이 발현되도록 강도 높힘\n④ 근수축 방향으로 기능적인 동작 시행\n\n(3) 적응증\n: 상위운동신경원 이상에 의한 마비성 증상의 근육 기능 개선 목적 활용\ne.g. 척수손상에 따른 족하수, 뇌졸중 환자 편마비 등\n\n(4) 주의사항\n: 일반적인 전기치료시의 주의사항에 준수\n① 심장박동기(pacemaker) 사용 환자, 임신부 하복이하 부위, 안면부위, 경동맥궁 인근,\n   피부자극 민감자, 감각 손실 부위, 급성 염증 부위 등 사용 금지\n② 과도한 근수축 유발로 인한 통증이 발생되지 않도록 주의","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-016","page":5,"section":"4. 전기자극요법 / 기능적 전기자극요법 FES","source_labels":["21학번 기말 3번"],"prompt":"FES에 대한 문제 틀린 것 고르기","original_question_type":"객관식 일부 복기","choices":[{"label":null,"text":"근육 방향과 수직으로 부착한다."}],"recorded_answer":{"value":"복기 문장 X; 수직 → 평행","status":"첨부본 답 기록","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":["첨부본의 수직(→ 평행)에서 정답을 알려주는 교정 표시를 문제와 분리함. 나머지 선택지는 없음."],"statement_judgments":[{"text":"근육 방향과 수직으로 부착한다.","recorded_judgment":"X"}],"explanation_excerpts":["전극을 마비된 근육의 motor point에 부착 / 근섬유 주행방향과 평행하게 전극 배치 / 근수축이 발현되도록 강도 높힘 / 근수축 방향으로 기능적인 동작 시행"],"source_block_raw":"21학번 기말 3번\nFES에 대한 문제 틀린 것 고르기\n근육 방향과 수직(→ 평행)으로 부착한다. (X)\n\nFES의 조작방법\n① 전극을 마비된 근육의 motor point에 부착\n② 근섬유 주행방향과 평행하게 전극 배치\n③ 근수축이 발현되도록 강도 높힘\n④ 근수축 방향으로 기능적인 동작 시행\n\f다. 경근간섭파요법 ICT","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-017","page":6,"section":"4. 전기자극요법 / 경근간섭파요법 ICT","source_labels":["21학번 기말 4번"],"prompt":"ICT에 대한 문제, 틀린 것 고르기","original_question_type":"객관식 일부 복기","choices":[{"label":null,"text":"사혈부위에 사용할 때, 물에 적신 스펀지를 부착하기 때문에 감염에 안전하다."}],"recorded_answer":{"value":"복기 문장 X","status":"첨부본 답 기록","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":["나머지 선택지는 없음."],"statement_judgments":[{"text":"사혈부위에 사용할 때, 물에 적신 스펀지를 부착하기 때문에 감염에 안전하다.","recorded_judgment":"X"}],"explanation_excerpts":["ICT는 피부 손상 부위, 체내 금속물질 삽입된 경우 등 사용 금지","심장박동기(pacemaker) 사용 환자, 임신부 하복이하 부위, 안면부위, 경동맥궁 인근, 피부자극 민감자, 감각 손실 부위, 피부 손상 부위, 체내 금속물질 삽입된 경우 등 사용 금지","과도한 근수축 유발로 인한 통증이 발생되지 않도록 주의 / 강한 피부자극에 의한 표피박리, 수포, 어반 등 발생 주의"],"source_block_raw":"21학번 기말 4번\nICT에 대한 문제, 틀린 것 고르기\n사혈부위에 사용할 때, 물에 적신 스펀지를 부착하기 때문에 감염에 안전하다. (X)\n(→ ICT는 피부 손상 부위, 체내 금속물질 삽입된 경우 등 사용 금지)\n\n(4) 주의사항\n: 일반적인 전기치료시의 주의사항에 준수\n① 심장박동기(pacemaker) 사용 환자, 임신부 하복이하 부위, 안면부위, 경동맥궁 인근,\n   피부자극 민감자, 감각 손실 부위, 피부 손상 부위, 체내 금속물질 삽입된 경우 등 사용 금지\n② 과도한 근수축 유발로 인한 통증이 발생되지 않도록 주의\n③ 강한 피부자극에 의한 표피박리, 수포, 어반 등 발생 주의\n\n라. SSPT","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-018","page":6,"section":"4. 전기자극요법 / SSPT","source_labels":["22학번 중간 10번","21학번 기말 1번"],"prompt":"구안와사 즉 안면마비에 치료가능한 전기자극요법 고르기","original_question_type":"치료법 명칭 답하기","choices":[],"recorded_answer":{"value":"SSPT","status":"첨부본 답 기록","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":["첨부본에 21학번 기말 1번의 별도 원문은 실려 있지 않음. 앞선 대화에서 언급된 별도 원문은 첨부본 추출문에 섞지 않음.","해설의 needless acupuncture는 첨부본 표기를 보존함. 앞선 대화에서 needleless acupuncture로 수정 필요하다고 지적됨."],"explanation_excerpts":["SSPT (Silver Spike Point Therapy) = needless acupuncture","SSP(Silver Spike Point) 뾰족한 전극을 이용하여 비침습적으로 저주파 전기 자극을 주는 치료 방법","표면전극을 활용하여 저주파를 통전하여 피부에 물리적∙전기적 자극","침을 두려워하는 경우, 민감한 피부, 안면부, 유아 등에 활용 가능 / 다른 전기치료에 비해 부작용이 적고 시술이 간편함","안면마비, 삼차신경통, 악관절통증, 긴장형 두통과 같은 안면근육신경 병증에 많이 활용 / 견경부, 요부, 슬부 등의 근골격계 통증 질환"],"source_block_raw":"22학번 중간 10번 / 21학번 기말 1번\n구안와사 즉 안면마비에 치료가능한 전기자극요법 고르기\nSSPT\n\n5) SSPT (Silver Spike Point Therapy)\n= needless acupuncture\n- SSP(Silver Spike Point) 뾰족한 전극을 이용하여 비침습적으로 저주파 전기 자극을 주는\n  치료 방법\n\n(1) 작용 및 장점\n① 표면전극을 활용하여 저주파를 통전하여 피부에 물리적∙전기적 자극\n② 침을 두려워하는 경우, 민감한 피부, 안면부, 유아 등에 활용 가능\n③ 다른 전기치료에 비해 부작용이 적고 시술이 간편함\n\n(3) 적응증\n① 안면마비, 삼차신경통, 악관절통증, 긴장형 두통과 같은 안면근육신경 병증에 많이 활용\n② 견경부, 요부, 슬부 등의 근골격계 통증 질환\n\n마. 치료법 비교와 임상례","grading_policy":"참고 답 기록. HTML 채점 방식은 후속 단계에서 정하며, 추정·보류·모순 문항은 확정 정답으로 자동채점하지 않음.","choice_number_scope":"첨부 정리 PDF에 표시된 번호만 보존. 원본 시험지의 번호를 별도로 입증하지 않음."},{"id":"CC-019","page":6,"section":" . 추가 논문 / 훈침 발생 시 조치 RIPCORD","source_labels":["21학번 중간 주관식 3번"],"prompt":"RIPCORD 설명쓰기 (국문으로)","original_question_type":"국문 서술형","choices":[],"recorded_answer":{"value":"위험 인식 → ABC → 발침·자세 → 소통 → 처치 → 재평가 → 기록","status":"첨부본 답 기록","basis":"첨부 PDF의 답안·색상·주석 기록. 수업자료/써머리 원본을 이번 단계에서 재검증하지 않음."},"notes":[],"rubric":[{"letter":"R","term":"Recognize","text":"환자의 위험요인을 인식하고, 환자의 미주신경성 실신 초기 증상을 인식하여 증상이 심화되는 것을 막는다"},{"letter":"I","term":"Initiate","text":"기도확보(airway, A), 호흡유지(breathing, B), 순환유지(circulation, C)를 확인한다."},{"letter":"P","term":"Position","text":"환자가 훈침이 발생하면, 환자의 침을 모두 발침하고, 앙와위로 눕히고 하지를 심장보다 높은 곳에 둔다. 환자의 옷을 풀어 호흡하기 편하게 하고 신선한 공기를 유지한다."},{"letter":"C","term":"Communicate","text":"환자를 관찰하여 의사소통이 가능한지 확인하고, 다른 주변 사람들이 불안하지 않도록 이야기를 전한다."},{"letter":"O","term":"Order treatments","text":"수구혈은 가장 많이 제안되는 경혈 중에 하나이고, 족삼리 혹은 합곡 또한 제안된다. 그 밖에 용천, 소료, 내관, 대릉, 노궁, 중충 등 경혈이 훈침을 치료하기 위한 치료혈로 제안되었다. 환자 상태가 악화되거나 5분이 지나도록 의식이 회복되지 않으면, 구급차를 불러 상급병원으로 호송시킨다."},{"letter":"R","term":"Reassess","text":"환자 치료 후에 환자 상태를 확인한다."},{"letter":"D","term":"Document","text":"마지막으로 환자 차트에 이상반응에 대해 기록한다."}],"source_block_raw":"21학번 중간 주관식 3번\nRIPCORD 설명쓰기 (국문으로)\n위험 인식 → ABC → 발침·자세 → 소통 → 처치 → 재평가 → 기록(족보 답안)\n\nRecognize / 환자의 위험요인을 인식하고, 환자의 미주신경성 실신 초기 증상을 인식하여 증상이\n             심화되는 것을 막는다\nInitiate / 기도확보(airway, A), 호흡유지(breathing, B), 순환유지(circulation, C)를 확인한다.\nPosition / 환자가 훈침이 발생하면, 환자의 침을 모두 발침하고, 앙와위로 눕히고 하지를 심장보다\n            높은 곳에 둔다. 환자의 옷을 풀어 호흡하기 편하게 하고 신선한 공기를 유지한다.\nCommunicate / 환자를 관찰하여 의사소통이 가능한지 확인하고, 다른 주변 사람들이 불안하지\n               않도록 이야기를 전한다.\nOrder treatments / 수구혈은 가장 많이 제안되는 경혈 중에 하나이고,\n                   족삼리 혹은 합곡 또한 제안된다.\n                   그 밖에 용천, 소료, 내관, 대릉, 노궁, 중충 등 경혈이 훈침을 치료하기 위한\n                   치료혈로 제안되었다.\n                   환자 상태가 악화되거나 5분이 지나도록 의식이 회복되지 않으면,\n                   구급차를 불러 상급병원으로 호송시킨다.\nReassess / 환자 치료 후에 환자 상태를 확인한다.\nDocument / 마지막으로 환자 차트에 이상반응에 대해 기록한다.\n\f6. 별도 보류 문항\n수업자료에 근거 안보임.. 내가 못찾는 걸수도 아니면 범위가 아닌 걸수도\n답은
