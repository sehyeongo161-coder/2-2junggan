const STORAGE='yangjin-concept-v2';
const $=id=>document.getElementById(id);
const indices=()=>QUESTIONS.map((_,i)=>i);
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){return {first:shuffled(indices()),retry:[],phase:'first',attempts:0,wrongIds:[],passed:[],last:null}}
let state;try{state=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch{}
if(!state||!Array.isArray(state.first)||!Array.isArray(state.retry)||!['first','retry','done'].includes(state.phase))state=fresh();
let locked=false;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
function currentId(){return state.phase==='first'?state.first[0]:state.retry[0]}
function current(){return QUESTIONS[currentId()]}
function resize(){if(parent!==window)parent.postMessage({type:'yangjin-size',height:document.documentElement.scrollHeight},location.origin)}
function render(){
 locked=false;
 const done=state.phase==='done',total=QUESTIONS.length;
 $('study').classList.toggle('hidden',done);$('finished').classList.toggle('hidden',!done);
 $('phase').textContent=done?'세트 완료':state.phase==='first'?'1차 전체 출제':'오답 복습';
 $('score').textContent='통과 '+state.passed.length+'/'+total+' · 누적 '+state.attempts+'회';
 const progress=done?total:state.phase==='first'?total-state.first.length:total;
 $('bar').style.width=(progress/total*100)+'%';
 if(done){$('stats').textContent='누적 '+state.attempts+'회 풀이 · 한 번 이상 틀린 문제 '+state.wrongIds.length+'개';save();resize();return}
 const q=current();$('category').textContent='예고 '+q.n+'번 · '+q.cat+' · '+(q.t==='ox'?'OX':'객관식');$('progress').textContent=state.phase==='first'?'전체 '+(total-state.first.length+1)+' / '+total:'남은 오답 '+state.retry.length+'문제';
 $('question').textContent=q.q;$('options').replaceChildren();$('feedback').classList.add('hidden');$('feedback').classList.remove('good','bad');
 if(q.t==='ox'){const wrap=document.createElement('div');wrap.className='ox';[['O',1],['X',0]].forEach(([t,v])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>answer(v);b.dataset.value=String(v);wrap.append(b)});$('options').append(wrap)}
 else q.opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.textContent=(i+1)+'. '+opt;b.dataset.value=String(i);b.onclick=()=>answer(i);$('options').append(b)});
 save();resize();
}
function answer(value){
 if(locked)return;locked=true;
 const id=currentId(),q=QUESTIONS[id],right=value===q.a;
 state.attempts++;state.last={id,right};if(right){if(!state.passed.includes(id))state.passed.push(id)}else if(!state.wrongIds.includes(id))state.wrongIds.push(id);
 if(state.phase==='first'){state.first.shift();if(!right&&!state.retry.includes(id))state.retry.push(id);if(!state.first.length)state.phase=state.retry.length?'retry':'done'}
 else{state.retry.shift();if(!right)state.retry.push(id);if(!state.retry.length)state.phase='done'}
 for(const b of $('options').querySelectorAll('button')){b.disabled=true;const n=Number(b.dataset.value);if(n===q.a)b.classList.add('correct');if(n===value&&!right)b.classList.add('wrong')}
 $('verdict').textContent=right?'O · 정답':'X · 오답';
 $('explanation').textContent=q.e;
 $('source').textContent='근거: won 정리본 '+q.p+'쪽';
 $('feedback').classList.remove('hidden');$('feedback').classList.add(right?'good':'bad');
 $('phase').textContent=state.phase==='retry'?'오답 복습':state.phase==='done'?'채점 완료':'1차 전체 출제';
 $('score').textContent='통과 '+state.passed.length+'/'+QUESTIONS.length+' · 누적 '+state.attempts+'회';
 save();resize();

}
$('advance').onclick=()=>{if(locked)render()};
$('reset').onclick=()=>{if(confirm('현재 개념체크 세트를 초기화할까요?')){state=fresh();render()}};
$('again').onclick=()=>{state=fresh();render()};
new ResizeObserver(resize).observe(document.body);
render();
</script></body></html>
