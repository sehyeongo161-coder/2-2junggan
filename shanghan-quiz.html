if(q.type==='mc'&&q.choices.length){question+='<div role="radiogroup" aria-label="정답 선택">'+q.choices.map((o,i)=>'<label class="choice"><input type="radio" name="choice" value="'+(i+1)+'" '+(selected===String(i+1)?'checked':'')+' '+(checked?'disabled':'')+'><span>'+mark[i]+' '+esc(o)+'</span></label>').join('')+'</div>';}
else if(q.type==='ox'){question+='<div class="row" role="radiogroup">'+['O','X'].map(c=>'<label class="choice"><input type="radio" name="choice" value="'+c+'" '+(selected===c?'checked':'')+' '+(checked?'disabled':'')+'><span>'+c+'</span></label>').join('')+'</div>';}
else{question+='<label for="free" class="muted">직접 답을 적어보세요. 답이 미복원된 문제는 참고·자가채점만 지원합니다.</label><textarea id="free" class="text-answer" placeholder="정답 입력" '+(checked?'disabled':'')+'>'+esc(draft)+'</textarea>';}
if(isInferred)question+='<div class="warning">GPT 복기 추정 정답을 기준으로 자동 채점합니다. 실제 시험의 확정 정답이라는 뜻은 아닙니다.</div>';
if(q.type==='mc'&&key===null)question+='<div class="warning">복원이 불완전하거나 충돌하여 정답 번호를 확정할 수 없습니다. 이 문제는 자동채점과 오답 통계에서 제외됩니다.</div>';
if(checked){let result=state.results[q.id],correct=!!result?.correct;question+='<div class="separate"><div class="status '+(correct?'right':'wrong')+'">'+(correct?'정답입니다':'오답입니다')+(result?.inferred?' · 복기 추정 기준':'')+'</div>'+explainMarkup(q)+'</div>';}
else if(revealed){question+='<div class="separate">'+explainMarkup(q)+'</div>';}
const cannotGrade=q.status==='불가'||q.status==='충돌'||(q.type==='mc'&&key===null);
const btn=checked?'<button id="next" class="primary">다음 문제 →</button>':
 revealed?(cannotGrade?'<button id="next" class="primary">다음 문제 →</button>':
  '<button id="manual-yes" class="primary">맞혔어요</button><button id="manual-no">틀렸어요</button><button id="next" type="button">건너뛰기</button>'):
 (key!==null?'<button id="check" class="primary">채점하기</button><button id="reveal">정답 보기</button>':
  '<button id="reveal" class="primary">정답·해설 확인</button><button id="next">건너뛰기</button>');
question+='<div class="actionbar"><button id="prev" '+(cursor===0?'disabled':'')+'>← 이전</button>'+btn+'</div>';$('question-card').innerHTML=question;
for(const e of $('question-card').querySelectorAll('input[name="choice"]'))e.onchange=()=>selected=e.value;let free=$('free');if(free)free.oninput=()=>draft=free.value;
function advance(){advanceQuestion();}
let prev=$('prev');if(prev)prev.onclick=()=>{cursor--;checked=false;revealed=false;selected='';draft='';renderQuiz();};let next=$('next');if(next)next.onclick=advance;
let reveal=$('reveal');if(reveal)reveal.onclick=()=>{revealed=true;renderQuiz();};let check=$('check');if(check)check.onclick=()=>{if(!selected&&q.type!=='fill'){alert('답을 선택해 주세요.');return;}if(key===null)return;let correct=q.type==='fill'?normalize(draft)===normalize(key):String(selected)===String(key);markAttempt(q,correct,false,isInferred);};let yes=$('manual-yes');if(yes)yes.onclick=()=>markAttempt(q,true,true);let no=$('manual-no');if(no)no.onclick=()=>markAttempt(q,false,true);
resize();}
function normalize(v){return String(v||'').replace(/[\s.,，。·ㆍ()（）]/g,'').toLowerCase();}
function markAttempt(q,correct,self,inferred=false){
 state.results[q.id]={correct,manual:self,inferred,date:Date.now()};
 put(saveKey,state);
 // 추정 정답으로 채점한 결과는 사용자별 오답 통계를 오염시키지 않음.
 if(!inferred)track('past-'+q.id,q.id+' '+q.prompt,correct,false);
 if(self){advanceQuestion();return;}
 checked=true;revealed=true;renderQuiz();
}
function explainMarkup(q){let s='';if(q.guess)s+='<div class="guess"><strong>GPT 복기 추정 · '+esc(q.status)+'</strong>\n'+esc(q.guess)+'</div>';s+='<div class="info" style="margin-top:9px"><strong>해설</strong>\n'+esc(q.explanation||'복기 또는 강의 내용이 부족하여 해설이 제한됩니다.')+'</div><div class="answer"><strong>정답</strong> · '+esc(q.answerDisplay||'미복원')+'</div>';if(q.status==='불가'||q.status==='추정')s+='<div class="muted">복기 불완전 · 확실하지 않은 답은 자동채점하지 않습니다.</div>';return s;}
$('list-lecture').onchange=e=>{listLecture=e.target.value;renderList();};$('list-toggle').onclick=()=>{listAnswers=!listAnswers;$('list-toggle').textContent=listAnswers?'정답·해설 가리기':'정답·해설 보기';renderList();};
function renderList(){let items=Q.filter(q=>listLecture==='all'||q.lecture===listLecture);$('list-items').innerHTML='<div class="row-space"><b>전체 족보 '+items.length+'개 항목</b><span class="muted">검정: 원문 · 주황: 복기 추정 · 하늘: 해설 · 빨강: 답</span></div>'+items.map(q=>{let result=state.results[q.id],label=result?(result.correct?'정답':'오답'):'미응시';let opts=q.choices.length?'<p class="muted">'+q.choices.map((o,i)=>mark[i]+' '+esc(o)).join(' · ')+'</p>':'';return '<article class="list-item"><div class="row-space"><button data-open="'+esc(q.id)+'"><b>'+esc(q.id)+'</b> · '+esc(q.topic)+' · '+esc(q.kind)+(q.playable?'':' · 미복원')+'</button><span class="muted">'+label+'</span></div><div class="muted">'+esc(q.prompt)+'</div>'+opts+(listAnswers?explainMarkup(q):'')+'</article>';}).join('');for(const b of $('list-items').querySelectorAll('[data-open]'))b.onclick=()=>{let q=Q.find(x=>x.id===b.dataset.open);if(!q?.playable){listAnswers=true;renderList();return;}lecture='all';$('lecture').value='all';retryOnly=false;orderMode='ordered';makeQueue();let i=queue.indexOf(q.id);if(i>=0)cursor=i;changeTab('quiz');};resize();}
function chosenGroup(){return M.find(g=>g.id===matchId)||M[0];}
function renderMatch(){let group=chosenGroup();$('match-menu').innerHTML=M.map(g=>'<button type="button" data-match="'+g.id+'" aria-pressed="'+(g.id===matchId)+'">'+esc(g.title)+'</button>').join('');for(const b of $('match-menu').querySelectorAll('button'))b.onclick=()=>{matchId=b.dataset.match;matchSelections={};matchChecked=false;renderMatch();};
let choices=group.pairs.map(v=>v[1]);let order=group.pairs.map((v,i)=>i);if(!matchSelections._order){matchSelections={_order:seededShuffle(order),_choices:seededShuffle(choices)};}
let html='<div class="row-space"><div><h2 style="font-size:19px;margin:0">'+esc(group.title)+'</h2><p class="muted" style="margin:0">'+esc(group.source)+' · '+group.pairs.length+'쌍</p></div><span class="pill">'+group.pairs.length+'개 짝 맞추기</span></div><p class="count">각 증상에 맞는 설명을 선택하세요.</p>';
for(const i of matchSelections._order){let pair=group.pairs[i],value=matchSelections[i]??'';let right=matchChecked&&value===pair[1];let cls=matchChecked?(right?'correct':'wrong'):'';html+='<div class="matching-row '+cls+'"><label for="pair-'+i+'">'+esc(pair[0])+'</label><select data-pair="'+i+'" id="pair-'+i+'" '+(matchChecked?'disabled':'')+'><option value="">-- 대응 항목 선택 --</option>'+matchSelections._choices.map((x,j)=>'<option value="'+esc(x)+'" '+(value===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'+(matchChecked?'<div class="grade-msg" style="color:'+(right?'#197a4c':'#bd374b')+'">'+(right?'O · 정답':'X · 정답: '+esc(pair[1]))+'</div>':'')+'</div>';}
if(matchChecked){let n=group.pairs.filter((p,i)=>matchSelections[i]===p[1]).length;html+='<div class="separate"><div class="score">'+n+' / '+group.pairs.length+' 정답</div><div class="info">'+esc(group.note)+'</div></div>';}else html+='<div class="warning">짝을 모두 선택한 뒤 채점하세요. 오답도 항목별로 따로 기록됩니다.</div>';
html+='<div class="actionbar">'+(matchChecked?'<button id="match-again" class="primary">같은 주제 다시 연습</button><button id="match-next">다음 주제 →</button>':'<button id="match-check" class="primary">매칭 채점하기</button>')+'</div>';$('match-card').innerHTML=html;
for(const el of $('match-card').querySelectorAll('[data-pair]'))el.onchange=()=>{matchSelections[Number(el.dataset.pair)]=el.value;};let bt=$('match-check');if(bt)bt.onclick=()=>{if(group.pairs.some((_,i)=>!matchSelections[i])){alert('모든 항목을 선택해 주세요.');return;}matchChecked=true;group.pairs.forEach((p,i)=>{let correct=matchSelections[i]===p[1];mstate.results[group.id+'-'+i]={correct,date:Date.now()};track('match-'+group.id+'-'+i,group.title+' · '+p[0],correct,false);});put(matchKey,mstate);renderMatch();};bt=$('match-again');if(bt)bt.onclick=()=>{matchChecked=false;matchSelections={};renderMatch();};bt=$('match-next');if(bt)bt.onclick=()=>{let i=M.findIndex(g=>g.id===matchId);matchId=M[(i+1)%M.length].id;matchChecked=false;matchSelections={};renderMatch();};resize();}
$('match-reset').onclick=()=>{matchChecked=false;matchSelections={};renderMatch();};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='shanghan-switch-mode'){changeTab(e.data.mode==='match'?'match':'quiz');}if(e.data?.type==='shanghan-open-question'&&typeof e.data.id==='string'){let id=e.data.id.replace(/^shanghan-past-/,'');let q=Q.find(q=>q.id===id);if(q){lecture='all';$('lecture').value='all';retryOnly=false;orderMode='ordered';makeQueue();cursor=queue.indexOf(id);changeTab('quiz');}}});
window.addEventListener('resize',resize);new ResizeObserver(resize).observe(document.body);
if(uid==='guest'){document.querySelector('.tabs').hidden=true;document.getElementById('quiz-area').innerHTML='<div class="card"><h2>로그인이 필요합니다</h2><p>본과 2-2 중간고사 사이트에서 승인된 계정으로 로그인한 뒤 상한론 &gt; 족보 문제 또는 매칭 연습을 이용해 주세요.</p></div>';document.getElementById('list-area').hidden=true;document.getElementById('match-area').hidden=true;}else{makeQueue();renderMatch();resize();}
})();
