<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>부인과학 족보 퀴즈</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#293347;background:#fcf9fa;--accent:#a84a69;--light:#fbeef3;--muted:#7a6a74;--line:#eadde3}
*{box-sizing:border-box}body{margin:0;padding:12px 0 55px;line-height:1.67}button,input,textarea{font:inherit}button{min-height:42px;padding:10px 17px;border-radius:10px;border:1px solid #dccfd4;background:#fff;cursor:pointer;color:#293347}button:hover{background:var(--light)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #be7c97;outline-offset:2px}button:disabled{opacity:.46;cursor:default}button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:750}button.primary:hover{filter:brightness(1.06)}[hidden]{display:none!important}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}h1{font-size:26px;letter-spacing:-.035em;line-height:1.4;margin:0}.eyebrow{color:#9b7c8b;font-size:13px;margin:0 0 4px}.summary{display:flex;flex-wrap:wrap;gap:7px}.summary span{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;font-size:14px;white-space:nowrap}.summary b{color:var(--accent)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.help{color:var(--muted);font-size:13px}.round{height:44px;width:44px;border-radius:50%;padding:0;font-size:26px;line-height:1}.card{background:#fff;border:1px solid #e9e1e5;border-radius:17px;padding:25px 27px;box-shadow:0 5px 22px #63213a07}.track{height:6px;background:#f1e8ec;border-radius:9px;overflow:hidden;margin-bottom:20px}.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:#815e6e;font-size:13px}.pill{border-radius:7px;padding:3px 9px;background:var(--light);color:#a54e71;font-weight:750}.card h2{font-size:23px;line-height:1.65;letter-spacing:-.035em;margin:16px 0 19px;white-space:pre-wrap;word-break:keep-all}.options{display:grid;gap:9px}.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 15px;line-height:1.5;border-color:#e7dce1}.opt .num{font-weight:800;color:#93566e;min-width:25px}.opt.selected{border-color:var(--accent);background:var(--light);box-shadow:inset 0 0 0 1px var(--accent)}.opt.right{border-color:#73ac85;background:#f0f8f1}.opt.wrong{border-color:#db979b;background:#fff1f1}.answer-fields{display:grid;gap:12px}.input-row label{display:block;color:#695c67;font-size:13px;font-weight:700;margin-bottom:5px}.answer-fields input,.answer-fields textarea{display:block;width:100%;padding:12px 14px;border:1px solid #d5c8cf;background:#fff;border-radius:9px;font-size:17px;color:#293347}.answer-fields textarea{resize:vertical;min-height:90px}.actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:9px}.feedback{margin-top:20px;padding:17px 19px;border-radius:11px;border:1px solid var(--line);background:#fdf9fb}.feedback h3{margin:0 0 8px;font-size:18px}.feedback p{margin:7px 0;white-space:pre-wrap}.feedback .yes{color:#246c43}.feedback .no{color:#b04451}.caution{background:#fff8ed;border:1px solid #f1d6ad;color:#8c5b24;border-radius:9px;padding:12px 14px;font-size:13px;margin:20px 0 20px}.finish{text-align:center;padding:30px 18px}.finish h2{margin:4px 0 12px}.source{margin:18px 0 0;color:#927b86;font-size:12px}.manual-buttons{display:flex;flex-wrap:wrap;gap:8px}.manual-buttons button{flex:1}.image-note{font-size:13px;background:#f7f3f5;padding:12px 14px;border-radius:9px;color:#6c5963;margin:12px 0}#error{color:#b33e4d}
.card .meta + .options{margin-top:20px}

.figure-block img{max-width:100%}
.figure-block{min-width:0;max-width:800px;margin-left:auto;margin-right:auto}
.figure-viewport{overflow:visible;overscroll-behavior:auto;border-radius:6px;touch-action:auto}
.figure-viewport:focus-visible{outline:3px solid #be7c97;outline-offset:2px}
.figure-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:12px}

@media(max-width:600px){body{padding-top:4px}h1{font-size:23px}.card{padding:21px 17px;border-radius:13px}.card h2{font-size:20px}.opt{padding:12px}.summary span{font-size:13px;padding:6px 9px}.actions button{flex:1}.card .actions{gap:8px}}

/* 부인과학: 퀴즈 / 전체 족보 목록 */
.view-switch{display:inline-flex;align-items:center;gap:3px;margin:2px 0 17px;padding:4px;background:#f2e9ed;border-radius:12px}

.view-switch button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 1px 6px #52243a12}
.list-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 14px}
.list-top h2{font-size:19px;margin:0;letter-spacing:-.025em}
.list-top p{margin:0;color:var(--muted);font-size:13px}
.list-answer-toggle{border:1px solid #d5c1cb;color:var(--accent);background:#fff;font-weight:700;font-size:13px;min-height:39px;padding:7px 14px}

.paper-status.wrong{color:#a34c4e;background:#fff0f0}
.paper-status.revealed{color:#8c6240;background:#fff6e7}
.paper-prompt{font-size:16px;font-weight:650;line-height:1.75;white-space:pre-wrap;word-break:keep-all;margin:11px 0 4px;overflow-wrap:anywhere}
.paper-choice-list{margin:10px 0 1px;padding:0;list-style:none;color:#536075;font-size:14px;display:grid;gap:6px}

.paper-detail{margin-top:10px;color:#756775;font-size:13px}

.paper-detail .figure-block{max-width:800px;margin:14px auto}

@media(max-width:600px){.view-switch{display:flex;width:100%}.view-switch button{flex:1}.paper-item{padding:15px 13px}.paper-prompt{font-size:15px}.list-top{align-items:flex-start}.paper-choice-list{font-size:13px}}

/* 족보 목록 정답·해설: 기출 원문과 근거, 객관식 선지별 이유 구분 */
.paper-answer{background:#faf8fa;border-color:#eadde3;color:#26374b;padding:13px 15px}
.paper-answer-key{color:#255c40;font-size:15px;font-weight:650}
.paper-explanation{margin-top:12px;border-top:1px solid #e6dde2;padding-top:11px;line-height:1.8;color:#3c495b;font-size:14px}
.paper-explanation>strong{font-size:13px;color:#9b526d}
.paper-explanation p{margin:6px 0 1px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.paper-note{margin-top:10px!important;color:#806b77!important;font-size:12px;line-height:1.75}
.paper-choice{padding:5px 0;border-bottom:1px solid #f1ecf0}
.paper-choice:last-child{border:0}
.choice-reason{font-size:13px;line-height:1.7;margin:5px 0 0 25px;word-break:keep-all}
.choice-reason.no{color:#b54b55}
.choice-reason.yes{color:#27734b}
.choice-reason b{display:inline-block;min-width:12px}
@media(max-width:600px){.paper-explanation{font-size:13px}.choice-reason{margin-left:18px}}

/* 원본 부인과 족보: 절별 랜덤 학습 */
.section-selector{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:1px 0 17px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.section-heading strong{color:#564e59;font-size:14px}.section-subtitle{font-size:12px;color:var(--muted)}
.section-buttons{display:flex;flex-wrap:wrap;gap:7px}
.section-buttons button{border:1px solid #e6d9df;min-height:38px;border-radius:9px;padding:7px 14px;font-size:14px;font-weight:680;white-space:nowrap;color:#776771}
.section-buttons button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-buttons button small{font-size:11px;opacity:.8;margin-left:3px}
.section-name{margin:10px 0 0;color:#8c6474;font-size:13px}
@media(max-width:600px){.section-selector{padding:12px}.section-buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.section-buttons button{min-height:41px;padding:7px 3px;font-size:13px}.section-buttons button small{display:block;font-size:10px;margin:0}}
.variant-picker{margin:0 0 17px;padding:13px 14px;border:1px solid #eadce2;background:#fff;border-radius:12px}
.variant-picker strong{display:block;font-size:14px;margin-bottom:8px;color:#655661}
.variant-options{display:flex;gap:7px;flex-wrap:wrap}
.variant-options button{font-size:14px;font-weight:650;min-height:38px;border-radius:9px;padding:7px 14px;border:1px solid #dfced6;background:#fff;color:#826d78}
.variant-options button[aria-pressed="true"]{border-color:var(--accent);background:var(--light);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.variant-note{font-size:12px;color:var(--muted);margin:8px 0 0}.paper-variant{background:#fff4ea;color:#98613b;border-radius:6px;font-weight:750;padding:3px 7px}
@media(max-width:600px){.variant-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.variant-options button{padding:8px 3px;font-size:12px}}

/* 세트: 1차 전 문항 → 오답만 재출제 → 모두 정답이면 완료 */
.retry-stage{margin:0 0 14px;padding:12px 14px;border-radius:11px;background:#fff8ed;border:1px solid #f0d7b8;color:#8e5c32;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.retry-stage strong{color:#995573}
.grade-feedback{margin:15px 0 12px;border-width:2px;scroll-margin-top:18px}
.grade-feedback.correct{border-color:#78b68e;background:#f4fbf5}
.grade-feedback.incorrect{border-color:#d99aa3;background:#fff6f6}
.grade-head{display:flex;align-items:flex-start;gap:14px}
.grade-mark{display:grid;place-items:center;flex:none;border-radius:50%;width:72px;height:72px;font-size:46px;font-weight:850;line-height:1;border:4px solid currentColor}
.grade-feedback.correct .grade-mark,.grade-feedback.correct .grade-title{color:#23834b}
.grade-feedback.incorrect .grade-mark,.grade-feedback.incorrect .grade-title{color:#c34356}
.grade-title{font-size:22px;font-weight:800;margin:0 0 4px}
.grade-question{font-size:14px;font-weight:650;line-height:1.6;color:#3e4c5c;margin:0!important;word-break:keep-all}
.grade-body{margin-top:13px;padding-top:11px;border-top:1px solid #e9e0e2;font-size:14px}
.grade-body p{line-height:1.75}
.card.grade-checked>.actions{margin-top:12px}
@media(max-width:600px){.grade-head{gap:10px}.grade-mark{width:56px;height:56px;font-size:37px;border-width:3px}.grade-title{font-size:19px}.grade-question{font-size:13px}}
</style>
</head>
<body>
<div class="header"><div><p class="eyebrow">본과 2학년 2학기 · 18~22학번</p><h1>부인과학 족보 퀴즈</h1></div><div id="summary" class="summary"></div></div>
<p id="error" role="status" hidden></p>
<div id="study" hidden>
<div class="section-selector" aria-label="부인과학 절별 출제 범위">
 <div class="section-heading"><strong>출제 범위</strong><span class="section-subtitle">선택한 절 안에서 랜덤 출제</span></div>
 <div id="section-buttons" class="section-buttons" role="group" aria-label="출제할 절 선택">
  <button type="button" data-section="all" aria-pressed="true">전체 <small>56</small></button>
  <button type="button" data-section="1" aria-pressed="false">제1절 <small>13</small></button>
  <button type="button" data-section="2" aria-pressed="false">제2절 <small>26</small></button>
  <button type="button" data-section="3" aria-pressed="false">제3절 <small>1</small></button>
  <button type="button" data-section="6" aria-pressed="false">제6절 <small>16</small></button>
 </div><p id="section-name" class="section-name">전체 범위 · 56문항</p>
</div>
<div id="variant-picker" class="variant-picker" hidden><strong id="variant-title">제1절 출제 유형</strong>
 <div id="variant-options" class="variant-options" role="group" aria-label="절별 기출 및 변형문제 선택">
  <button type="button" data-mode="original" aria-pressed="false">기출만 · 13</button>
  <button type="button" data-mode="mixed" aria-pressed="true">기출+변형 · 37</button>
  <button type="button" data-mode="variant" aria-pressed="false">변형만 · 24</button>
 </div><p class="variant-note">변형문제는 기출에 기반한 새 연습문제로, 실제 기출과 구분하여 표시합니다.</p>
</div>
<nav class="view-switch" role="tablist" aria-label="부인과학 학습 화면">
  <button type="button" id="view-quiz" role="tab" aria-selected="true" aria-controls="quiz-view">퀴즈</button>
  <button type="button" id="view-list" role="tab" aria-selected="false" aria-controls="list-view" tabindex="-1">목록</button>
</nav>
<section id="quiz-view" role="tabpanel" aria-labelledby="view-quiz">
<div class="toolbar"><span class="help" id="quiz-scope-help">전체 족보 · 중복 없이 무작위 출제</span><button id="reset" class="round" title="이번 회차 초기화·전체 문제 다시 섞기" aria-label="전체 문제 다시 시작">↻</button></div>
<div id="stage" class="card"></div>
</section>
<section id="list-view" role="tabpanel" aria-labelledby="view-list" hidden>
 <div class="list-top">
  <div><h2 id="list-heading">족보 전체 목록 <span id="list-count" class="paper-labels"></span></h2><p>PDF 순서대로 문항 · 정답과 해설 확인</p></div>
  <button id="list-toggle-answers" class="list-answer-toggle" type="button" aria-pressed="false">정답 보기</button>
 </div>
 <div id="list-items" class="past-paper-items"></div>
</section>
<p class="source">출처: 18~22학번 부인과 족보 모음(16쪽). 복원 불확실 문항은 '자가채점'으로 표기합니다. 이미지가 필요한 문제는 원본 PDF 쪽수를 함께 표시합니다.</p>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const TYPES={ox:'O/X',mc:'객관식',fill:'빈칸',short:'단답형',manual:'복원불완전·서술형'};
const labels=['①','②','③','④','⑤','⑥'];
let bank=[],byId=new Map(),s=null,uid=null,loaded=false,pendingFocus=null;
let viewMode="quiz",listAnswersShown=true,scope="all",variantMode="mixed";
const SECTIONS=Object.freeze({
 all:"전체 범위",1:"제1절 · 한의 여성의학의 기원과 발전",
 2:"제2절 · 여성의학 임상을 위한 인체 구조의 이해",
 3:"제3절 · 심신의학과 여성질환",
 6:"제6절 · 병력청취와 신체검사"
});
const SECTION1_TOPICS=Object.freeze({"001":"범주","002":"범주","003":"황도연","004":"동의보감","006":"전란","007":"황제내경","008":"금궤요략","009":"송대","010":"부인대전양방","011":"주단계","012":"주단계","013":"경악전서","014":"부청주"});
const MODE_CHOICES=['original','mixed','variant'];
function supportsVariants(section){return ['1','2','3','6'].includes(section);}
function activeVariantModeKey(section){
 const base="midterm-2-2-2026:quiz:v1:"+uid+":obgyn-variant-mode-v1";
 return section==='1'?base:base+':section'+section;
}
function readVariantMode(section){
 const saved=host()?.__QUIZ_STORAGE.getItem(activeVariantModeKey(section));
 return MODE_CHOICES.includes(saved)?saved:'mixed';
}
function scopedBank(){
 const relevant=bank.filter(q=>q.section===scope);
 if(scope==="all")return bank.filter(q=>!q.variant);
 if(!supportsVariants(scope))return relevant.filter(q=>!q.variant);
 return variantMode==="original"?relevant.filter(q=>!q.variant):
 variantMode==="variant"?relevant.filter(q=>q.variant):relevant;
}
function setVariantMode(next){
 if(!supportsVariants(scope)||!MODE_CHOICES.includes(next)||next===variantMode)return;
 variantMode=next;host().__QUIZ_STORAGE.setItem(activeVariantModeKey(scope),next);
 s=loadedState();renderScope();if(viewMode==="list")renderList();else render();resize();
}
function scopeStoreKey(){return "midterm-2-2-2026:quiz:v1:"+uid+":obgyn-current-section-v1";}
function renderScope(){
 const selected=scopedBank();
 $("variant-picker").hidden=!supportsVariants(scope);
 if(supportsVariants(scope)){
  $("variant-title").textContent="제"+scope+"절 출제 유형";
  const all=bank.filter(q=>q.section===scope);
  const base=all.filter(q=>!q.variant).length;
  const changed=all.filter(q=>q.variant).length;
  for(const button of document.querySelectorAll("#variant-options [data-mode]")){
   button.setAttribute("aria-pressed",String(button.dataset.mode===variantMode));
   const m=button.dataset.mode;
   button.textContent=(m==="original"?"기출만":m==="variant"?"변형만":"기출+변형")+
    " · "+(m==="original"?base:m==="variant"?changed:all.length);
  }
 }
 for(const b of document.querySelectorAll("#section-buttons [data-section]"))
  b.setAttribute("aria-pressed",String(b.dataset.section===scope));

 const img=questionFigure(q);
 const stageHeading=s.phase==='retry'?
   '<div class="retry-stage"><strong>오답 재도전 · '+s.retryRound+'회차</strong><span>현재 남은 오답 '+pendingWrongIds().length+'문항</span></div>':
   '<div class="retry-stage"><strong>1차 출제</strong><span>모든 문제를 한 번씩 푼 뒤 오답을 다시 풀어요.</span></div>';
 const html='<div class="track"><i style="width:'+100*s.cursor/s.order.length+'%"></i></div>'+stageHeading+
  '<div class="meta"><b>'+(s.phase==='retry'?'오답 ':'문제 ')+(s.cursor+1)+' / '+s.order.length+'</b><span>· '+answered()+'문항 풀이</span></div>'+
  '<h2>'+esc(q.prompt)+'</h2>'+title+img+(q.uncertain?'<div class="caution">복원상 일부 선지·그림·정답이 불확실합니다. 자동 채점 가능한 답은 원문 복원값 기준이며, 서술형·선지 미복원 문항은 자가채점합니다.</div>':'')+(q.type==='ox'||q.type==='mc'?optionMarkup(q):entryMarkup(q));
 let actions='';
 if(manual){
  actions=s.checked?'<button id="next" class="primary">다음 문제 →</button>':s.preview?'<div class="manual-buttons"><button id="manual-correct" class="primary">맞혔어요</button><button id="manual-wrong">틀렸어요</button></div>':'<button id="manual-reveal" class="primary">모범답안 확인</button>';
 }else{
  actions=s.checked?'<button id="next" class="primary">다음 문제 →</button>':'<button id="check" class="primary">채점하기</button><button id="show-answer">정답 보기</button>';
 }
 $('stage').classList.toggle('grade-checked',!!s.checked);
 $('stage').innerHTML=html+(s.checked?feedbackMarkup(q):manual&&s.preview?'<div class="feedback"><h3>자료에 적힌 답안</h3><p>'+esc(Array.isArray(q.answer)?q.answer.join(' / '):q.answer)+'</p><p>'+esc(q.note||'자신의 답안과 비교해서 채점해 주세요.')+'</p></div>':'')+
  '<div class="actions">'+actions+'</div>';
 $('stage').querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{s.selected=b.dataset.opt;save();render()});
 $('stage').querySelectorAll('[data-field]').forEach(el=>{
  el.oninput=()=>{s.draft[Number(el.dataset.field)]=el.value;save()};
  el.addEventListener('keydown',ev=>{
    if(ev.key!=='Enter'||ev.isComposing||ev.keyCode===229||ev.repeat||
       ev.shiftKey||ev.ctrlKey||ev.altKey||ev.metaKey||s.checked)return;
    ev.preventDefault();
    const index=Number(el.dataset.field);
    s.draft[index]=el.value;
    save();
    if(q.type==='manual'){
      if(!s.preview){s.preview=true;save();render();}
      return;
    }
    if(q.type==='fill'&&index<q.answer.length-1){
      $('ans-'+(index+1))?.focus();
      return;
    }
    submit(evaluate(q),false);
  });
});
 if(q.type==='ox'||q.type==='mc'){
   const currentOptions=$('stage').querySelectorAll('[data-opt]');
   currentOptions.forEach(el=>el.addEventListener('keydown',ev=>{
     if(ev.key!=='Enter'||ev.isComposing||ev.keyCode===229||s.checked)return;
     if(s.selected!==el.dataset.opt)return; // First Enter selects; next Enter submits.
     ev.preventDefault();
     submit(evaluate(q),false);
   }));
 }
 if($('check'))$('check').onclick=()=>submit(evaluate(q),false);
 if($('show-answer'))$('show-answer').onclick=()=>submit(false,true);
 if($('manual-reveal'))$('manual-reveal').onclick=()=>{s.preview=true;save();render()};
 if($('manual-correct'))$('manual-correct').onclick=()=>submit(true,false);
 if($('manual-wrong'))$('manual-wrong').onclick=()=>submit(false,false);
 if($('next'))$('next').onclick=advanceQuestion;
 resize();
}

function listAnswerText(q){
 if(q.displayAnswer)return q.displayAnswer;
 if(Array.isArray(q.answer))return q.answer.join(' / ');
 if(q.type==='mc'){const n=Number(q.answer)-1;return labels[n]+' '+(q.choices?.[n]||'');}
 return String(q.answer||'');
}
function renderList(){
 if(!s)return;
 const area=$('list-items');
 area.replaceChildren();
 $('list-count').textContent='· '+scopedBank().length+'문항';
 $('list-toggle-answers').textContent=listAnswersShown?'정답·해설 가리기':'정답·해설 보기';
 $('list-toggle-answers').setAttribute('aria-pressed',String(listAnswersShown));
 const frag=document.createDocumentFragment();
 const shown=scopedBank();
 for(let i=0;i<shown.length;i++){
  const q=shown[i],outcome=s.results[q.id];
  const status=outcome?(outcome.revealed?'정답 보기':outcome.correct?'정답':'오답'):'미응시';
  const statusClass=outcome?(outcome.revealed?'revealed':outcome.correct?'correct':'wrong'):'';
  const item=document.createElement('article');
  item.className='paper-item'+(statusClass?' is-'+statusClass:'');
  const meta='<div class="paper-top"><div class="paper-labels"><span class="paper-number">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(TYPES[q.type]||q.type)+'</span><span>'+(q.variant?'<span class="paper-variant">변형 · 원기출 '+esc(q.sourceId)+'</span>':'기출 '+esc(q.years))+'</span><span>PDF '+esc(q.page)+'쪽</span></div><span class="paper-status '+statusClass+'">'+status+'</span></div>';
  let options='';
  if(q.type==='mc'&&Array.isArray(q.choices)){
   options='<ol class="paper-choice-list">'+q.choices.map((v,j)=>{
     const good=String(q.answer)===String(j+1);
     const reason=listAnswersShown&&q.choiceExplanations?.[j]?'<div class="choice-reason '+(good?'yes':'no')+'"><b>'+(good?'O':'X')+'</b> · '+esc(q.choiceExplanations[j])+'</div>':'';
     return '<li class="paper-choice"><span>'+labels[j]+' '+esc(v)+'</span>'+reason+'</li>';
   }).join('')+'</ol>';
  }
  // 그림 문제에서 원본 자료의 그림을 확인할 수 있도록 펼침 영역을 둡니다.
  const figure=(FIGURES[q.id]||q.figureKey)?'<details class="paper-detail"><summary>문제 그림 보기</summary>'+questionFigure(q)+'</details>':'';
  let answer='';
  if(listAnswersShown){
   answer='<div class="paper-answer"><p class="paper-answer-key"><strong>정답</strong> · '+esc(listAnswerText(q))+'</p>'+
     '<div class="paper-explanation"><strong>해설</strong><p>'+esc(q.explanation||'원본 족보에서 해설을 확인할 수 없습니다.')+'</p></div>'+
     (q.note?'<p class="paper-note">원본 주의사항 · '+esc(q.note)+'</p>':'')+'</div>';
  }
  item.innerHTML=meta+'<p class="paper-prompt">'+esc(q.prompt)+'</p>'+options+figure+(q.uncertain?'<span class="paper-restoration">※ 일부 내용 복원 불완전</span>':'')+answer;
  frag.append(item);
 }
 area.append(frag);
 resize();
}
function selectView(mode){
 viewMode=mode==='list'?'list':'quiz';
 const quiz=viewMode==='quiz';
 $('quiz-view').hidden=!quiz;
 $('list-view').hidden=quiz;
 $('view-quiz').setAttribute('aria-selected',String(quiz));
 $('view-list').setAttribute('aria-selected',String(!quiz));
 $('view-quiz').tabIndex=quiz?0:-1;
 $('view-list').tabIndex=quiz?-1:0;
 updateHeader();
 if(quiz)render();else renderList();
 requestAnimationFrame(resize);
}
$('view-quiz').onclick=()=>selectView('quiz');
$('view-list').onclick=()=>selectView('list');
$('list-toggle-answers').onclick=()=>{listAnswersShown=!listAnswersShown;renderList();};
$('list-items').addEventListener('toggle',()=>requestAnimationFrame(resize),true);
window.addEventListener('resize',()=>requestAnimationFrame(resize));

function reset(){s=blankState();save();render();window.scrollTo({top:0,behavior:'instant'});}
function goTo(id){
 if(!byId.has(id))return;
 const requested=byId.get(id);
 if(requested.variant){
  if(scope!==requested.section)setScope(requested.section);
  if(variantMode==='original')setVariantMode('mixed');
 }else if(scope!=='all'&&requested.section!==scope)setScope(requested.section);
 if(supportsVariants(scope)&&variantMode==='variant'&&!requested.variant)setVariantMode('mixed');
 const idx=s.order.indexOf(id);
 if(idx<0)return;
 if(idx!==s.cursor){const item=s.order.splice(idx,1)[0];s.order.splice(s.cursor,0,item);s.checked=false;s.preview=false;s.decision=null;s.selected='';s.draft=[];save();}
 render();window.scrollTo({top:0,behavior:'instant'});
}
// Enter while editing: answer fields advance one by one and the last field grades.
// Enter after grading: advance to the next question, without triggering a double click.
// Capture lets the handler intercept the default Enter click on the "next" button.
document.addEventListener('keydown',ev=>{
 if(ev.key!=='Enter'||ev.isComposing||ev.keyCode===229||ev.repeat||
    ev.shiftKey||ev.ctrlKey||ev.altKey||ev.metaKey||viewMode!=='quiz'||!s)return;
 const target=ev.target;
 if(target?.closest?.('.figure-block'))return;
 if(s.checked){
   const inCard=target===document.body||target===document.documentElement||
      !!target?.closest?.('#stage');
   if(!inCard||s.cursor>=s.order.length)return;
   ev.preventDefault();
   ev.stopPropagation();
   advanceQuestion();
   return;
 }
 if(target?.closest?.('input,textarea,select,button,a,summary,[role="tab"]'))return;
 const q=getCurrent();
 if(q&&(q.type==='ox'||q.type==='mc')&&s.selected){
   ev.preventDefault();
   submit(evaluate(q),false);
 }
},true);
document.addEventListener('click',ev=>{
 const button=ev.target.closest('.figure-zoom');
 if(!button)return;
 const viewport=button.closest('.figure-block').querySelector('.figure-viewport');
 const zoomed=viewport.classList.toggle('is-zoomed');
 button.setAttribute('aria-expanded',String(zoomed));
 button.textContent=zoomed?'화면에 맞추기':'그림 확대';
 if(!zoomed){viewport.scrollLeft=0;viewport.scrollTop=0;}
 resize();
});
$('reset').onclick=reset;
for(const b of document.querySelectorAll('#section-buttons [data-section]'))b.addEventListener('click',()=>setScope(b.dataset.section));
for(const b of document.querySelectorAll('#variant-options [data-mode]'))b.addEventListener('click',()=>setVariantMode(b.dataset.mode));
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='obgyn-open-question'&&typeof e.data.id==='string'){if(!loaded)pendingFocus=e.data.id;else goTo(e.data.id.replace(/^obgyn-/i,''));}});
(async()=>{
 try{
  const p=host();if(!p)throw new Error('로그인 후 부인과학 탭에서 열어주세요.');
  uid=p.__QUIZ_USER_ID;
  const res=await fetch('./obgyn-bank.json?v=20261016-all-chapters-variants-v20',{cache:'no-cache'});
  if(!res.ok)throw new Error('부인과학 문제 데이터를 불러올 수 없습니다.');
  bank=await res.json();if(!Array.isArray(bank)||!bank.length)throw new Error('문제 데이터 형식이 올바르지 않습니다.');
  byId=new Map(bank.map(x=>[x.id,x]));
  if(bank.length!==206||bank.filter(q=>q.variant).length!==150||bank.some(q=>!Object.hasOwn(SECTIONS,q.section)))throw new Error('문항의 절 구분 데이터가 올바르지 않습니다.');
  const savedScope=p.__QUIZ_STORAGE.getItem(scopeStoreKey());
  scope=Object.hasOwn(SECTIONS,savedScope)?savedScope:'all';
  variantMode=supportsVariants(scope)?readVariantMode(scope):'mixed';
  s=loadedState();loaded=true;renderScope();
  $('study').hidden=false;render();if(pendingFocus){goTo(pendingFocus.replace(/^obgyn-/i,''));pendingFocus=null;}
 }catch(e){$('error').hidden=false;$('error').textContent=e.message;resize();}
})();
})();
</script>
</body>
</html>
